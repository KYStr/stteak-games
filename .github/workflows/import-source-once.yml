name: One-time reviewed source import # 僅用一次的公開原始碼匯入，不執行遊戲或建置。
run-name: Reviewed source import by ${{ github.actor }} # GitHub 記錄操作者，不把輸入放進 shell。
on: # 只有人工手動觸發；上傳與 push 不會自動執行。
  workflow_dispatch: # 不設定 push、pull_request、schedule 或其他事件。
    inputs: # 兩個輸入僅作安全 gate，不含任何秘密。
      approve_one_time_import: # 必須先取得使用者對一次 contents:write 工作的批准。
        description: '已批准：只跑一次公開標準 runner，10 分鐘內匯入，之後 owner UI 刪除此 workflow' # 使用者須理解剩餘人工清理步驟。
        type: boolean # 明確布林核准，不接受任意命令。
        required: true # 不能省略安全確認。
        default: false # 預設不核准。
      expected_bootstrap_commit: # 上傳三份檔案後再次從 GitHub 讀取 main 完整 SHA。
        description: '三份 bootstrap 全部上傳完成後的 main 完整 40 字元 commit SHA' # 舊 SHA 或 main 更新都會中止。
        type: string # 僅由 Python 驗完整小寫 SHA，不插入指令。
        required: true # 不可省略競爭更新保護。
permissions: {} # workflow 預設不授權；只在唯一 job 開 contents:write。
concurrency: # 全 repo 使用單一佇列，禁止此匯入工作平行執行。
  group: stteak-reviewed-source-import-once # 不依 branch 或 actor 分裂群組。
  cancel-in-progress: false # 不用新派發中斷已有核驗；第二次會因起點改變而失敗。
jobs: # 全流程只有一個 job，沒有 matrix 或連鎖 workflow。
  import-reviewed-source: # 僅匯入固定 SHA 的來源，不安裝套件或執行來源。
    if: ${{ github.repository == 'KYStr/stteak-games' && github.repository_owner == 'KYStr' && github.actor == 'KYStr' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.approve_one_time_import }} # 開 runner 前先封鎖非核准事件、owner、repo、branch、private 及重跑。
    runs-on: ubuntu-24.04 # 只用 GitHub 公開 repo 的標準 Linux runner，不用付費 larger 或 self-hosted。
    timeout-minutes: 10 # 一次工作硬上限十分鐘，不自動重試。
    permissions: # 只有本 job 取得提交公開來源所需權限。
      contents: write # 不開 workflows、actions、issues、packages 或其他權限，不另造 PAT。
    env: # 手動輸入只經環境變數交給 Python，不做 shell 展開。
      EXPECTED_BOOTSTRAP_COMMIT: ${{ inputs.expected_bootstrap_commit }} # 只接受精確 main SHA。
      APPROVE_ONE_TIME_IMPORT: ${{ inputs.approve_one_time_import }} # Python 會再次比對字面 true。
      GIT_TERMINAL_PROMPT: '0' # 憑證或權限失敗就停止，不等待互動或尋找其他憑證。
    steps: # 沒有 cache、artifact upload、套件安裝、瀏覽器或部署。
      - name: Checkout exact dispatch commit # 僅下載已核准事件的 commit。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 已核的官方 checkout v7.0.1 完整 SHA。
        with: # 使用官方 action 管理本 job 自動到期的 GITHUB_TOKEN。
          ref: ${{ github.sha }} # 不跟隨後來變動的 branch HEAD。
          fetch-depth: 0 # 必須核對已知初始 commit 與完整 bootstrap 差異。
          fetch-tags: false # 不需要 tags。
          persist-credentials: true # 只讓後續 git push 使用本 job token，結束由 checkout 清理。
          submodules: false # 不遞迴或執行外部 repository。
          lfs: false # 不下載或啟動 Git LFS 流程。
          clean: true # 使用一次性 runner 的乾淨 checkout。
      - name: Verify bounded source archive and import exact files # 全部 gate 通過才寫入核准來源。
        shell: python3 {0} # 直接跑自含 Python，不把輸入經 shell 執行。
        run: | # 下方就是完整 import_gate.py，不需再上傳任何 helper。
          #!/usr/bin/env python3
          # 此檔只供離線審查與產生自含 workflow；不要另外上傳或直接執行匯入入口。
          import gzip  # 以逐段解壓方式限制 gzip 展開量。
          import hashlib  # 使用固定 SHA-256 核對兩個輸入及每個原始檔。
          import io  # 為已驗證的小型 manifest 提供記憶體讀取。
          import json  # 解析 manifest 與 GitHub 的可信事件檔。
          import os  # 讀取 runner 環境並檢查實際檔案類型。
          import re  # 限制 SHA、路徑與 GitHub commit 的格式。
          import stat  # 明確排除符號連結及特殊檔案。
          import subprocess  # 只用固定參數呼叫 Git，不經 shell。
          import tarfile  # 僅解析單一 512-byte header；絕不呼叫 extract 或 extractall。
          from dataclasses import dataclass  # 將固定限額與離線 fixture 的限額分開。
          from pathlib import Path  # 僅處理已通過白名單檢查的路徑。
          
          @dataclass(frozen=True)  # 執行時不得悄悄修改核准的輸入摘要與限額。
          class GateSpec:  # 提供純離線 gate 的明確資料契約。
              archive_sha256: str  # 核准壓縮檔的完整雜湊。
              manifest_sha256: str  # 核准 manifest 的完整雜湊。
              archive_bytes: int  # 核准壓縮檔的精確大小。
              manifest_bytes: int  # 核准 manifest 的精確大小。
              raw_tar_bytes: int  # gzip 解壓後連同 header/padding 的精確上限。
              files: int  # 核准的一般檔案數量。
              total_bytes: int  # 核准原始檔合計大小。
              max_file_bytes: int = 3_000_000  # 每檔硬上限 3 MB，不允許單一巨大 member。
          
          SPEC = GateSpec(  # 此處完整固定目前已核准來源，不接受 dispatch 改寫。
              "c7a33eba4404df87ed126cae7a15656e58a61a3e066f2fc5487a0e756f1dbbc4",  # archive 的 SHA-256。
              "a8d3b5e23a7ab2719f6a32808777066daa4a3ce1421026989affb2221c38f792",  # manifest 的 SHA-256。
              20_495_630,  # archive 精確 byte 數，低於 GitHub 網頁單檔 25 MiB 限制。
              155_975,  # manifest 精確 byte 數。
              60_979_200,  # 本 tar 包含所有 header/padding 的精確解壓長度。
              758,  # 來源檔案總數。
              60_390_388,  # 所有來源檔案內容 byte 數。
          )  # 固定限額到此結束。
          REPOSITORY = "KYStr/stteak-games"  # 僅允許目標公開 repository。
          OWNER = "KYStr"  # 僅允許既定 owner 與手動操作者。
          INITIAL_COMMIT = "40e57ee05711ce8d204a84e58d0fcd8497631b00"  # 開始前只有 README/LICENSE 的既知 commit。
          ARCHIVE_PATH = "stteak-source-import.tar.gz"  # 網頁上傳 archive 的公開根目錄路徑。
          MANIFEST_PATH = "stteak-source-publish-manifest.json"  # 網頁上傳 manifest 的公開根目錄路徑。
          WORKFLOW_PATH = ".github/workflows/import-source-once.yml"  # 本一次性 workflow 的公開路徑。
          BOOTSTRAP_PATHS = {ARCHIVE_PATH, MANIFEST_PATH, WORKFLOW_PATH}  # 起點只允許此三個明列 bootstrap 檔案。
          REMOVE_PATHS = {ARCHIVE_PATH, MANIFEST_PATH}  # job 只移除兩個傳輸檔；workflow 留給 owner 在 UI 清理。
          ROOT_FILES = {".gitignore", "ASSET-LICENSES.md", "LICENSE", "LICENSE-SCOPE.md", "README.md", "THIRD_PARTY_NOTICES.md", "package-lock.json", "package.json", "release-status.json"}  # 核准根目錄檔案白名單。
          ROOT_DIRECTORIES = {"assets", "games", "launcher", "licenses", "public", "scripts", "tests"}  # 核准來源資料夾白名單。
          DENIED_PARTS = {".git", ".github", ".ssh", ".aws", ".codex", ".agents", "node_modules", "dist", "coverage", "artifacts", "qa", "reports", "private", "secrets", "credentials"}  # 額外拒絕機敏、工具、建置及私人報告目錄。
          
          
          def require(condition, message):  # 所有安全前提均以 fail-closed 方式處理。
              if not condition:  # 任何不符合既定契約的資料都停止。
                  raise ValueError(message)  # 不輸出原始秘密或輸入內容。
          
          
          def validate_path(name):  # 路徑只能是核准 manifest 的相對來源路徑。
              require(isinstance(name, str) and re.fullmatch(r"[A-Za-z0-9_./-]+", name), "invalid path characters")  # 禁止控制字元、反斜線、冒號及非預期字元。
              parts = name.split("/")  # 保留空片段供明確拒絕，而不是先正規化掩蓋攻擊。
              require(all(part not in {"", ".", ".."} for part in parts), "absolute, empty or traversal path")  # 拒絕絕對路徑、重複斜線及穿越。
              require(all(part.casefold() not in DENIED_PARTS for part in parts), "denied path component")  # 不允許觸及 Git、workflow 或私人資料。
              require(all(not part.casefold().startswith(".env") for part in parts), "environment file denied")  # 不匯入環境設定或可能含秘密的檔案。
              require(all(not part.casefold().endswith((".pem", ".key", ".p12", ".pfx")) for part in parts), "credential file denied")  # 不匯入金鑰或憑證容器。
              require((len(parts) == 1 and name in ROOT_FILES) or (len(parts) > 1 and parts[0] in ROOT_DIRECTORIES), "source root not approved")  # 僅能落在固定來源白名單。
              return name  # 回傳未曾正規化或重新解讀的原始安全路徑。
          
          
          def strict_object(pairs):  # JSON 重複 key 不能被解析器靜默覆寫。
              result = {}  # 僅保留首次出現且不重複的欄位。
              for key, value in pairs:  # 逐一檢查原始 JSON key。
                  require(key not in result, "duplicate JSON key")  # 重複的安全條件一律拒絕。
                  result[key] = value  # 合法欄位加入結果。
              return result  # 回傳無歧義的 JSON object。
          
          
          def checked_bytes(path, expected_size, expected_hash):  # 先驗固定輸入，再解析任何內容。
              info = path.lstat()  # 不跟隨最後一層 symlink。
              require(stat.S_ISREG(info.st_mode), "input is not a regular file")  # 排除 symlink、pipe 及裝置。
              require(info.st_size == expected_size, "input size mismatch")  # 讀檔前就限制最大記憶體用量。
              data = path.read_bytes()  # 兩個固定輸入合計小於 21 MB。
              require(len(data) == expected_size and hashlib.sha256(data).hexdigest() == expected_hash, "input SHA-256 mismatch")  # 防止讀檔期間變化或輸入被替換。
              return data  # 僅傳回已完整驗證的輸入。
          
          
          def load_manifest(data, spec):  # 檢查 manifest 自身的數量、大小、路徑與 digest 契約。
              document = json.loads(data, object_pairs_hook=strict_object)  # 只解析 JSON，不執行來源程式。
              require(isinstance(document, dict) and isinstance(document.get("summary"), dict), "invalid manifest structure")  # 必須具有已知結構。
              rows = document.get("files")  # 取得唯一來源白名單。
              require(isinstance(rows, list) and len(rows) == spec.files, "manifest file count mismatch")  # 不能增減核准檔案。
              require(document["summary"].get("files") == spec.files and document["summary"].get("bytes") == spec.total_bytes, "manifest summary mismatch")  # 摘要必須與固定限額一致。
              manifest, folded = {}, set()  # 同時拒絕重複及大小寫碰撞路徑。
              for row in rows:  # 逐檔建立核准清單。
                  require(isinstance(row, dict) and set(row) == {"path", "bytes", "sha256", "kind"}, "invalid manifest file record")  # 不接受未定義記錄欄位。
                  name = validate_path(row["path"])  # 在任何 filesystem 操作之前檢查路徑。
                  require(name not in manifest and name.casefold() not in folded, "duplicate manifest path")  # 避免重複與跨平台碰撞。
                  require(type(row["bytes"]) is int and 0 <= row["bytes"] <= spec.max_file_bytes, "manifest file size outside limit")  # 不將 bool 誤當大小，也不接受巨檔。
                  require(isinstance(row["sha256"], str) and re.fullmatch(r"[0-9a-f]{64}", row["sha256"]), "invalid file digest")  # 每檔必須提供完整小寫 SHA-256。
                  require(row["kind"] in {"text", "binary"}, "invalid file kind")  # 保持既有 manifest 類型契約。
                  manifest[name] = row  # 記錄已檢查的來源檔。
                  folded.add(name.casefold())  # 記錄大小寫無關的唯一性。
              require(sum(row["bytes"] for row in manifest.values()) == spec.total_bytes, "manifest byte total mismatch")  # 全部來源內容必須正好等於核准 byte 數。
              require(not (set(manifest) & BOOTSTRAP_PATHS), "source overlaps bootstrap")  # 清理 bootstrap 時不得誤刪來源。
              return manifest  # 後續每個 tar member 都必須精確命中此清單。
          
          
          def validate_archive(archive_data, manifest, spec):  # 只驗證及讀進受限記憶體，不寫任何檔案。
              files, consumed = {}, 0  # 保存最多約 60.4 MB 的已驗證內容與解壓計數。
              with gzip.GzipFile(fileobj=io.BytesIO(archive_data), mode="rb") as stream:  # 對壓縮資料使用逐段讀取。
                  def read_exact(size):  # 每次讀取都先檢查總解壓硬上限。
                      nonlocal consumed  # 計數涵蓋 header、內容及 padding。
                      require(size >= 0 and consumed + size <= spec.raw_tar_bytes, "decompression limit exceeded")  # 宣告大小超額時不進行解壓。
                      data = stream.read(size)  # 單次讀取最多一個核准 member 或 512-byte header。
                      consumed += len(data)  # 將實際讀取量加入全域預算。
                      require(len(data) == size, "truncated archive")  # 不允許不完整 header 或內容。
                      return data  # 回傳受限的一段 bytes。
                  while True:  # 逐一讀取，不讓 tarfile 自動處理 PAX/GNU 擴充。
                      header = read_exact(512)  # tar header 永遠固定 512 bytes。
                      if header == bytes(512):  # 第一個空 header 表示 archive 結尾。
                          require(len(files) == spec.files, "archive ended before expected count")  # 不能提前結束而漏檔。
                          require(read_exact(512) == bytes(512), "missing second tar end block")  # 必須有標準兩個結尾空區塊。
                          while consumed < spec.raw_tar_bytes:  # 檢查剩餘 tar record padding。
                              require(not any(read_exact(min(64 * 1024, spec.raw_tar_bytes - consumed))), "nonzero trailing tar data")  # 不允許結尾藏額外 archive 或未列內容。
                          require(stream.read(1) == b"", "decompression exceeds exact limit")  # 多一 byte 也拒絕，包括串接 gzip 的膨脹資料。
                          break  # 僅在完整 EOF、CRC 及限制檢查後完成。
                      require(len(files) < spec.files, "too many archive members")  # 額外 member 在解析內容之前就拒絕。
                      require(header[156:157] == b"0" and header[257:265] == b"ustar\x0000", "only plain USTAR regular files allowed")  # 拒絕 link、directory、device、sparse、PAX 與 GNU 長檔名擴充。
                      member = tarfile.TarInfo.frombuf(header, "utf-8", "strict")  # 僅解析已固定長度且通過類型篩選的 header；也驗 checksum。
                      name = validate_path(member.name)  # 再驗 tar 真實路徑，不依賴 manifest 自述。
                      require(name in manifest and name not in files, "unlisted or duplicate tar path")  # 每個檔案只能出現一次且必須已核准。
                      require(member.isreg() and not member.linkname and member.mode == 0o644, "unexpected tar metadata")  # 不允許連結、可執行或特殊模式。
                      require(member.uid == 0 and member.gid == 0 and member.mtime == 0 and not member.uname and not member.gname, "unexpected archive ownership metadata")  # 固定可重現 metadata，不帶私人帳號名稱。
                      size = member.size  # 只使用已核准 header 的一般檔案大小。
                      require(type(size) is int and 0 <= size <= spec.max_file_bytes and size == manifest[name]["bytes"], "tar member size mismatch")  # 解壓前限制單檔大小並比對 manifest。
                      content = read_exact(size)  # 最多只讀 3 MB 的單一來源檔內容。
                      require(hashlib.sha256(content).hexdigest() == manifest[name]["sha256"], "tar member SHA-256 mismatch")  # 內容必須與逐檔核准 SHA 完全一致。
                      require(not any(read_exact((-size) % 512)), "nonzero member padding")  # padding 不得藏資料。
                      files[name] = content  # 完整驗證後才收下該來源檔。
              require(set(files) == set(manifest) and sum(map(len, files.values())) == spec.total_bytes, "final archive set or size mismatch")  # 最後再次核對路徑集合與總 byte 數。
              return files  # 回傳全部已驗證內容；此前尚未動到 checkout。
          
          
          def load_inputs(archive_path, manifest_path, spec=SPEC):  # 純離線入口，可供測試 real archive 與惡意 fixture。
              manifest_data = checked_bytes(Path(manifest_path), spec.manifest_bytes, spec.manifest_sha256)  # 先固定 manifest 身份。
              archive_data = checked_bytes(Path(archive_path), spec.archive_bytes, spec.archive_sha256)  # 再固定 archive 身份。
              manifest = load_manifest(manifest_data, spec)  # 建立唯一核准來源清單。
              return manifest, validate_archive(archive_data, manifest, spec)  # 所有內容驗完才提供給寫入階段。
          
          
          def validate_context(env, event):  # 純函式檢查派發身份、分支、輸入與公開狀態。
              expected = env.get("EXPECTED_BOOTSTRAP_COMMIT", "")  # 手動派發時填入上傳完成後的精確 main commit。
              require(re.fullmatch(r"[0-9a-f]{40}", expected), "expected bootstrap commit must be full SHA")  # 禁止 branch、tag、縮寫或注入內容。
              values = {"GITHUB_ACTIONS": "true", "GITHUB_EVENT_NAME": "workflow_dispatch", "GITHUB_REPOSITORY": REPOSITORY, "GITHUB_REPOSITORY_OWNER": OWNER, "GITHUB_ACTOR": OWNER, "GITHUB_REF": "refs/heads/main", "GITHUB_RUN_ATTEMPT": "1", "GITHUB_SHA": expected, "APPROVE_ONE_TIME_IMPORT": "true"}  # 只准 owner 首輪從 main 手動派發。
              require(all(env.get(key) == value for key, value in values.items()), "runner context gate rejected")  # 任何不符都在 Git 寫入之前停止。
              repository, sender, inputs = event.get("repository", {}), event.get("sender", {}), event.get("inputs", {})  # 將可信 GitHub event 也一併核對。
              require(repository.get("full_name") == REPOSITORY and repository.get("owner", {}).get("login") == OWNER and repository.get("private") is False and repository.get("default_branch") == "main", "repository event gate rejected")  # 禁止 private repo、fork 或改過 default branch 的 repo。
              require(sender.get("login") == OWNER and inputs.get("expected_bootstrap_commit") == expected and inputs.get("approve_one_time_import") in {True, "true"}, "dispatch event gate rejected")  # UI 確認及 SHA 必須與 runner 一致。
              return expected  # 此 SHA 將作為唯一合法起點。
          
          
          def git(*arguments, data=None):  # Git 子程序不經 shell，不執行任意使用者字串。
              result = subprocess.run(["git", "-c", "core.hooksPath=/dev/null", *arguments], input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False, timeout=90)  # 每個 Git 動作也有九十秒上限。
              require(result.returncode == 0, "git command failed: " + arguments[0])  # 不把可能含憑證的 Git 設定或 stderr 印入公開 log。
              return result.stdout  # 僅在呼叫處解析必要輸出。
          
          
          def remote_main():  # 只讀既定 origin 的 main，不取得其他 branch。
              lines = git("ls-remote", "--exit-code", "origin", "refs/heads/main").decode("ascii").splitlines()  # 查詢服務端目前的 main SHA。
              require(len(lines) == 1 and lines[0].endswith("\trefs/heads/main"), "unexpected remote main response")  # 不接受多筆或其他 ref。
              return lines[0].split("\t")[0]  # 回傳唯一 main SHA 供 race guard。
          
          
          def tree_entries(tree):  # 讀取整棵樹，避免忽略、額外或 symlink 檔案漏檢。
              result = {}  # 路徑對應 Git mode 與 blob object ID。
              for record in git("ls-tree", "-r", "-z", tree).split(b"\0"):  # 使用 NUL 分隔，避免檔名字元干擾。
                  if record:  # 忽略唯一的尾端空片段。
                      metadata, name = record.split(b"\t", 1)  # Git 固定格式將 metadata 與路徑分開。
                      mode, kind, object_id = metadata.decode("ascii").split(" ")  # 只讀取所需的 object metadata。
                      require(kind == "blob" and mode == "100644", "non-regular git tree entry")  # 禁止 symlink、submodule 及 executable。
                      result[name.decode("utf-8")] = object_id  # 保存真實 tree 路徑。
              return result  # 可用來比對整棵來源樹的完整集合。
          
          
          def verify_tree(tree, manifest, retained):  # 確認來源 bytes 相同，並且一次性 workflow 完全未改。
              entries = tree_entries(tree)  # 檢查整棵 staged 或 remote commit 樹。
              require(set(entries) == set(manifest) | set(retained), "git tree paths differ from manifest and retained workflow")  # 只允許核准來源及待 owner UI 刪除的 workflow。
              require(all(entries[name] == object_id for name, object_id in retained.items()), "retained workflow changed")  # job 絕不修改、刪除或重建自身 workflow。
              entries = {name: object_id for name, object_id in entries.items() if name in manifest}  # 後續逐檔 hash 只處理已核准來源。
              request = "".join(object_id + "\n" for object_id in entries.values()).encode("ascii")  # 一次傳入已由 Git 輸出的安全 object ID。
              batch = io.BytesIO(git("cat-file", "--batch", data=request))  # 以單一 Git 子程序讀取最多約 60.4 MB blobs。
              for name, object_id in entries.items():  # 按 request 順序解析精確 blob 內容。
                  header = batch.readline().decode("ascii").strip().split(" ")  # batch header 指定物件種類及長度。
                  require(len(header) == 3 and header[:2] == [object_id, "blob"] and header[2] == str(manifest[name]["bytes"]), "git blob metadata mismatch")  # Git blob 必須具有核准長度。
                  content = batch.read(manifest[name]["bytes"])  # 僅讀指定 blob 長度，不按內容切行。
                  require(batch.read(1) == b"\n" and hashlib.sha256(content).hexdigest() == manifest[name]["sha256"], "git blob SHA-256 mismatch")  # 防止 attributes 或 Git 清理過濾造成內容變化。
              require(batch.read(1) == b"", "extra git batch output")  # 不接受額外內容或解析歧義。
          
          
          def write_verified_files(root, files):  # 只有全部 gate 通過後才覆寫核准路徑。
              for name, content in files.items():  # 逐個寫入 manifest 中精確列出的檔案。
                  validate_path(name)  # 寫入階段再次核路徑白名單，避免未來重構誤用此 helper。
                  target = root / name  # name 已拒絕所有絕對路徑及穿越。
                  parent = root  # 從可信 checkout 根目錄逐層檢查。
                  for component in name.split("/")[:-1]:  # 不允許父路徑透過 symlink 逃出工作目錄。
                      parent = parent / component  # 只延伸一個已核准的安全片段。
                      if parent.exists() or parent.is_symlink():  # 對存在的目錄與斷掉的 symlink 都做檢查。
                          require(not parent.is_symlink() and parent.is_dir(), "unsafe existing parent")  # 任意非目錄或 symlink 都拒絕。
                      else:  # 缺少來源資料夾時才建立。
                          parent.mkdir(mode=0o755)  # 只在既定 checkout 下建立必要父目錄。
                  if target.exists() or target.is_symlink():  # 原本只有 README/LICENSE 可被同名覆寫。
                      require(not target.is_symlink() and target.is_file(), "unsafe existing target")  # 拒絕 symlink 與特殊檔。
                  descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_TRUNC | os.O_NOFOLLOW, 0o644)  # 最後一層再次禁止 symlink。
                  with os.fdopen(descriptor, "wb") as handle:  # 自動關閉 descriptor，避免未完成寫入。
                      handle.write(content)  # 寫入已逐檔 SHA 驗證的 bytes，不執行任何來源。
                  target.chmod(0o644)  # 固定一般非可執行檔模式。
          
          
          def import_repository():  # 這是只在已批准的 GitHub runner 才會使用的唯一寫入入口。
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"), object_pairs_hook=strict_object)  # 讀取 GitHub 產生的事件，不接受自行拼接 JSON。
              expected = validate_context(os.environ, event)  # 在任何來源寫入前檢查完整派發 context。
              root = Path.cwd().resolve()  # checkout 的工作目錄是唯一合法寫入範圍。
              require(Path(os.environ["GITHUB_WORKSPACE"]).resolve() == root, "not in GitHub workspace root")  # 不允許改成其他目錄。
              require(git("rev-parse", "HEAD").decode().strip() == expected and remote_main() == expected, "main changed before import")  # 派發 SHA、checkout HEAD 及服務端 main 必須完全一致。
              require(git("status", "--porcelain=v1", "--untracked-files=all") == b"", "checkout is not clean")  # 不掩蓋任何既有工作或不明檔案。
              git("merge-base", "--is-ancestor", INITIAL_COMMIT, expected)  # 必須是既知初始 repo 的後代，不可換 repo history。
              require(set(tree_entries(INITIAL_COMMIT)) == {"README.md", "LICENSE"}, "initial tree differs from known repository")  # 既知起點只允許兩個初始檔。
              require(set(tree_entries(expected)) == {"README.md", "LICENSE"} | BOOTSTRAP_PATHS, "bootstrap tree contains unexpected files")  # 手動上傳期間不得夾入其他檔案。
              changed = set(filter(None, git("diff", "--name-only", "-z", INITIAL_COMMIT, expected).decode().split("\0")))  # 核對從初始 commit 到 bootstrap commit 的完整差異。
              require(changed == BOOTSTRAP_PATHS, "main changed outside approved bootstrap paths")  # README/LICENSE 的人工修改也會令匯入中止。
              retained = {WORKFLOW_PATH: tree_entries(expected)[WORKFLOW_PATH]}  # 固定 workflow 原始 blob，禁止 job 寫入 workflow。
              manifest, files = load_inputs(root / ARCHIVE_PATH, root / MANIFEST_PATH)  # SHA、路徑、數量、尺寸及內容必須全部通過。
              require(remote_main() == expected, "main changed during archive validation")  # 驗證時間內 main 若前進也不繼續。
              git("config", "--local", "core.autocrlf", "false")  # 不改換行或全域設定。
              git("config", "--local", "commit.gpgsign", "false")  # 不依賴或呼叫任何私人 signing key。
              git("config", "--local", "user.name", "github-actions[bot]")  # 使用 GitHub 官方 Actions bot 身份。
              git("config", "--local", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")  # 只用官方 bot noreply，不公開使用者 email。
              write_verified_files(root, files)  # 核驗完全部來源才開始精確寫入。
              pathspec = b"\0".join(name.encode("utf-8") for name in manifest) + b"\0"  # 使用 NUL 路徑清單，避免 shell 展開或引數上限。
              git("--literal-pathspecs", "add", "--pathspec-from-file=-", "--pathspec-file-nul", data=pathspec)  # 只 stage manifest 明列路徑，絕不 git add .。
              git("--literal-pathspecs", "rm", "--", *sorted(REMOVE_PATHS))  # 只刪除 archive 與 manifest；不寫入 .github/workflows。
              tree = git("write-tree").decode().strip()  # 取得即將提交的完整 staged tree。
              verify_tree(tree, manifest, retained)  # 再驗精確 758 來源檔與每個 SHA，另保留原樣 workflow。
              require(remote_main() == expected, "main changed before commit")  # main 有任何變化就停止，不 rebase、不合併、不重試。
              git("commit", "-m", "Import reviewed MIT game sources and remove transfer bootstrap files")  # 只產生一個來源匯入與清理 commit。
              commit = git("rev-parse", "HEAD").decode().strip()  # 保存將推送的完整 commit SHA。
              require(git("rev-parse", "HEAD^").decode().strip() == expected, "unexpected commit parent")  # 唯一父 commit 必須是人工核准的 bootstrap SHA。
              require(remote_main() == expected, "main changed immediately before push")  # push 前最後一次檢查，不覆蓋新工作。
              git("push", "--porcelain", "origin", "HEAD:refs/heads/main")  # 只正常 fast-forward push main；不用 force，也不擴權或重試。
              require(remote_main() == commit, "remote main does not match pushed commit")  # push 成功後必須讀回服務端 SHA。
              git("fetch", "--no-tags", "--depth=1", "origin", "refs/heads/main")  # 只取回 main 做服務端結果檢查。
              require(git("rev-parse", "FETCH_HEAD").decode().strip() == commit, "remote advanced during verification")  # 若有競爭更新，不把結果報為完整成功。
              verify_tree("FETCH_HEAD", manifest, retained)  # 對讀回 commit 再核全部來源與未變動的 workflow。
              require(git("status", "--porcelain=v1", "--untracked-files=all") == b"", "checkout not clean after commit")  # 不留下未提交來源或 bootstrap 資料。
              print(json.dumps({"repository": REPOSITORY, "branch": "main", "commit": commit, "files": len(manifest), "bytes": SPEC.total_bytes, "all_file_sha256_verified": True, "transfer_files_removed_from_current_tree": sorted(REMOVE_PATHS), "retained_workflow": WORKFLOW_PATH, "repository_files": len(manifest) + 1, "owner_ui_cleanup_required": True, "remote_verified": True}, ensure_ascii=False, sort_keys=True))  # stdout 僅輸出公開且可稽核的最終摘要。
          
          
          if __name__ == "__main__":  # 匯入此模組做離線測試不會執行 repository 操作。
              import_repository()  # 直接執行僅可在完整 GitHub guard 與明確使用者批准後進行。
