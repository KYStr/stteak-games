name: Read only native package identity # 零browser／零遊戲／零安裝的固定身份診斷。
run-name: Native package metadata only by ${{ github.actor }} # 不接受自由命令或目標URL。
on: # 僅owner手動派發，沒有push／PR／schedule。
  workflow_dispatch: # 每輪須重新明確確認，沒有自動重試。
    inputs: # 只有布林同意，不存在browser旗標或版本輸入。
      confirm_metadata_only: # 只讀metadata不等於授權launch。
        description: '僅20秒唯讀Chrome套件身份；不執行Chrome或遊戲、不安裝或變更設定' # 明確有限目的。
        type: boolean # 不使用模糊字串確認。
        default: false # 預設不執行。
        required: true # owner須明示同意。
permissions: {} # 無checkout、GitHub內容寫入或token可選scope。
concurrency: # 共用原單一QA群組，不能與browser測試並行。
  group: stteak-single-public-capability # 最多一個工作負載在跑。
  cancel-in-progress: false # 不取消既有證據來搶runner。
jobs: # 只有一個標準runner工作。
  metadata: # 沒有其他gameplay job或followup。
    if: ${{ github.repository == 'KYStr/stteak-games' && github.repository_owner == 'KYStr' && github.actor == 'KYStr' && !github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.confirm_metadata_only }} # 與原已核固定repo/owner/public/main/manual/attempt1一致。
    runs-on: ubuntu-24.04 # 不改OS或self-hosted，只觀測新官方標準image。
    timeout-minutes: 2 # 整job有限；Python診斷本身另有20秒硬界。
    env: # 不映射secret、token或私人QA。
      QA_PRIVATE: ${{ github.event.repository.private }} # 從官方事件取得真實公開性。
      QA_CONFIRM_METADATA_ONLY: ${{ inputs.confirm_metadata_only }} # 布林確認在腳本內再核。
    steps: # 不checkout、不setup-node、不npm、不apt、不安裝browser／font。
      - name: One bounded read only package metadata probe # 唯一命令，沒有網路或Chrome執行。
        env: # 固定公開診斷原文，沒有外部路徑或自由輸入。
          QA_SOURCE: | # 原Python逐行中文註解，literal保留精確bytes。
            import hashlib, json, os, re, selectors, stat, subprocess, sys, time # 僅系統Python標準庫，沒有安裝、網路或browser套件。
            BINARY = '/opt/google/chrome/chrome' # 只作固定owner查詢與stat目標，絕不執行這個binary。
            COMMANDS = {'package': ['/usr/bin/dpkg-query', '--admindir=/var/lib/dpkg', '-W', '-f=${Package}\n${Version}\n${Architecture}\n${Status}\n${Maintainer}\n${Source}\n${Homepage}\n', 'google-chrome-stable'], 'owner': ['/usr/bin/dpkg-query', '--admindir=/var/lib/dpkg', '-S', BINARY]} # 固定argv，無shell、--version、apt或其他套件。
            PATHS = [('etc', '/etc', 'directory'), ('usr', '/usr', 'directory'), ('usrBin', '/usr/bin', 'directory'), ('queryExecutable', '/usr/bin/dpkg-query', 'executable'), ('var', '/var', 'directory'), ('varLib', '/var/lib', 'directory'), ('database', '/var/lib/dpkg', 'directory'), ('info', '/var/lib/dpkg/info', 'directory'), ('status', '/var/lib/dpkg/status', 'file'), ('packageList', '/var/lib/dpkg/info/google-chrome-stable.list', 'file')] # 受保護來源未核實就不查metadata，不讀任意路徑。
            VERSION = re.compile(r'[1-9][0-9]{1,2}\.[0-9]{1,3}\.[0-9]{1,6}\.[0-9]{1,6}-[0-9]{1,3}\Z') # 僅有界四段數字版及數字Debian revision，觀測不是放行清單。
            class Rejected(Exception): # 只允許本程式定義的有限診斷代碼。
                pass # 不把任意外部例外訊息帶進公開報告。
            def inspect_path(path, kind): # 固定路徑只讀stat與realpath，不chmod/chown或跟任意使用者路徑。
                value = os.lstat(path); mode = value.st_mode # lstat才能區分symlink本身，不以stat掩蓋連結。
                return {'read': True, 'canonical': os.path.realpath(path) == path, 'nonSymlink': not stat.S_ISLNK(mode), 'rootOwned': value.st_uid == 0, 'typeMatches': stat.S_ISDIR(mode) if kind == 'directory' else stat.S_ISREG(mode), 'groupWritable': bool(mode & stat.S_IWGRP), 'worldWritable': bool(mode & stat.S_IWOTH), 'executable': bool(mode & 0o111)} # 只輸出有限布林，不回任意uid/mode/路徑。
            def trusted(value, kind): # 維持受保護資料與dpkg工具的來源門檻，不以metadata自證安全。
                return all(value.get(k) is True for k in ['read', 'canonical', 'nonSymlink', 'rootOwned', 'typeMatches']) and value.get('groupWritable') is False and value.get('worldWritable') is False and (kind != 'executable' or value.get('executable') is True) # 可寫、symlink、錯型態或錯owner一律不查套件。
            def query(key, deadline): # 只執行兩個固定唯讀dpkg查詢，不建立shell或Chrome程序。
                if key not in COMMANDS: raise Rejected('unknown-query') # 未列命令拒絕，不接受任意argv。
                limit = min(deadline, time.monotonic() + 3.0); output = bytearray(); process = None; selector = None # 單指令三秒，仍裁整體內部十七秒收尾界。
                try: # stdout限制採流式讀取，不能先無界capture再檢長度。
                    process = subprocess.Popen(COMMANDS[key], stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, env={'PATH': '/usr/bin:/bin', 'LANG': 'C', 'LC_ALL': 'C'}, cwd='/', shell=False) # 最小環境、固定工作目錄、不繼承token／dpkg環境覆寫。
                    selector = selectors.DefaultSelector(); selector.register(process.stdout, selectors.EVENT_READ) # 只等待此唯讀子程序的stdout。
                    while True: # 不是重試命令，僅收同一stdout到EOF或界線。
                        remaining = limit - time.monotonic() # 每次讀取重新核單調截止，不能靠零碎輸出延長。
                        if remaining <= 0: raise Rejected('query-timeout') # 逾時只終止這個已建立子程序，不另開替代。
                        if not selector.select(remaining): raise Rejected('query-timeout') # 沒輸出也不能無限等待。
                        chunk = os.read(process.stdout.fileno(), 4097 - len(output)) # 一次只讀到上限加一，記憶體不隨外部輸出增長。
                        if not chunk: break # 真EOF才結束讀取，不用poll猜資料完整。
                        output.extend(chunk) # 只暫存有界metadata，不寫原文到log或磁碟。
                        if len(output) > 4096: raise Rejected('query-output-limit') # 任意大量輸出立即fail-closed。
                    remaining = limit - time.monotonic() # EOF後等待退出也包含於原三秒。
                    if remaining <= 0: raise Rejected('query-timeout') # 不借整體餘額替單命令延長。
                    if process.wait(timeout=remaining) != 0: raise Rejected('query-rejected') # 非零退出不當成沒有套件或合法資料。
                    return bytes(output).decode('utf-8', errors='strict') # 非UTF-8只回固定失敗，不替換成可能誤判字串。
                except subprocess.TimeoutExpired: raise Rejected('query-timeout') # 系統wait逾時保留相同固定類別。
                except UnicodeDecodeError: raise Rejected('query-invalid-encoding') # 解析失敗不輸出原始bytes。
                except Rejected: raise # 已知固定類別才原樣保留。
                except Exception: raise Rejected('query-unavailable') # 其他系統例外不列message或stack。
                finally: # 關閉只屬本診斷的子程序及管線。
                    if selector is not None: selector.close() # 不遺留本次selector。
                    if process is not None: # 未成功建立子程序不呼叫清理API。
                        if process.poll() is None: # 只在仍未退出時終止，絕不掃系統程序。
                            process.kill() # 此固定dpkg查詢不應留下子程序，未確認不得繼續查詢。
                            try: process.wait(timeout=0.5) # 有界收尾，外層19秒TERM加1秒KILL仍是總硬界。
                            except subprocess.TimeoutExpired: pass # 不把未ack終止冒稱已完整清理。
                        if process.stdout is not None: process.stdout.close() # metadata管線不存檔。
            def parse_package(text): # 只對固定dpkg輸出形狀解碼，不回傳任意原文字段。
                lines = text.splitlines() # Source空欄保留在中間，結尾newline不算額外欄。
                if len(lines) != 7: raise Rejected('metadata-shape-unrecognized') # 缺欄或多欄都不猜資料。
                package, version, architecture, status, maintainer, source, homepage = lines # 僅這七個預定欄位，沒有其他套件資料。
                source_status = 'not-recorded' if source == '' else 'known-literal' if source in ['google-chrome-stable', 'google-chrome'] else 'unrecognized' # Source只是套件自述，不代表下載來源已驗證。
                return {'packageMatches': package == 'google-chrome-stable', 'versionStatus': 'observed-format-valid' if VERSION.fullmatch(version) else 'unrecognized', 'packageVersion': version if VERSION.fullmatch(version) else None, 'architectureMatches': architecture == 'amd64', 'installedMatches': status == 'install ok installed', 'maintainerMatches': maintainer == 'Chrome Linux Team <chromium-dev@chromium.org>', 'sourceStatus': source_status, 'sourcePackage': source if source_status == 'known-literal' else None, 'homepageMatches': homepage in ['https://www.google.com/chrome/', 'https://www.google.com/chrome'], 'downloadSourceVerified': False} # 數字版本只是觀測；任何欄相符也不授權browser。
            def identity(env): # 公開run身份與授權門檻先核，禁止任意repo／重跑／非owner。
                expected = {'GITHUB_REPOSITORY': 'KYStr/stteak-games', 'GITHUB_REPOSITORY_OWNER': 'KYStr', 'GITHUB_ACTOR': 'KYStr', 'GITHUB_REF': 'refs/heads/main', 'GITHUB_EVENT_NAME': 'workflow_dispatch', 'GITHUB_RUN_ATTEMPT': '1', 'QA_PRIVATE': 'false', 'QA_CONFIRM_METADATA_ONLY': 'true'} # 不讀使用者secret或整個環境。
                if any(env.get(key) != value for key, value in expected.items()): raise Rejected('identity-gate') # false或缺值就停止，不推論授權。
                if not re.fullmatch(r'[0-9]{1,20}', env.get('GITHUB_RUN_ID', '')) or not re.fullmatch(r'[a-f0-9]{40}', env.get('GITHUB_SHA', '')) or env.get('GITHUB_WORKFLOW_SHA') != env.get('GITHUB_SHA'): raise Rejected('identity-format') # 固定run/commit格式與同workflow commit，防混輪證據。
                return {'repository': expected['GITHUB_REPOSITORY'], 'runId': env['GITHUB_RUN_ID'], 'commit': env['GITHUB_SHA'], 'workflowCommit': env['GITHUB_WORKFLOW_SHA'], 'attempt': 1} # 只回必要公開身份。
            def collect(env, path_reader=inspect_path, query_reader=query, now=time.monotonic): # 可用純mock驗證，不安裝或啟動browser。
                started = now(); deadline = started + 17.0 # 腳本內留收尾餘額，外層整個Python最多20秒。
                report = {'schemaVersion': 1, 'scope': 'readonly-package-identity-only', 'outcome': 'blocked', 'launchAuthorized': False, 'browserExecuted': False, 'gameVisited': False, 'binaryVersionExecuted': False, 'binaryChecksumVerified': False, 'sandboxConfigurationModified': False, 'image': {'status': 'requires-parent-official-header-binding', 'actual': None, 'missingSubjectTagResolved': False}, 'paths': {}, 'package': None, 'ownerMatches': None, 'errors': []} # 不把套件觀測或未知image當成安全放行。
                try: # 任一前提不可信即停，但仍可封存固定有限資訊。
                    report['provenance'] = identity(env) # 授權與身份先核，才接觸系統metadata。
                    for key, path, kind in PATHS: # 唯讀檢查固定受保護來源，收齊已允許的有限路徑。
                        if now() >= deadline: raise Rejected('diagnostic-deadline') # 全局界優先於下一讀取。
                        try: value = path_reader(path, kind) # 不讀檔內容，不exec驗證binary。
                        except Exception: value = {'read': False} # 任意原始系統錯誤不公開。
                        report['paths'][key] = value # 固定path key，不存實際可疑路徑文字。
                    if not all(trusted(report['paths'][key], kind) for key, _, kind in PATHS): raise Rejected('protected-source-untrusted') # 不為過gate跳過owner、mode或canonical。
                    if now() >= deadline: raise Rejected('diagnostic-deadline') # 可信路徑也不能越過整體界。
                    report['package'] = parse_package(query_reader('package', deadline)) # 固定套件查詢一次，不迴圈找其他版本。
                    if now() >= deadline: raise Rejected('diagnostic-deadline') # metadata晚到不能再查下一步。
                    report['ownerMatches'] = query_reader('owner', deadline).strip() == 'google-chrome-stable: ' + BINARY # 只比對固定binary owner，不輸出任意回覆。
                    if now() >= deadline: raise Rejected('diagnostic-deadline') # 結果也不能晚到洗成功。
                    report['outcome'] = 'metadata-observed-not-authorized' # 只是讀取完成，永遠沒有browser allowlist更新或launch。
                except Rejected as error: report['errors'].append(str(error)) # 本類別只由固定本地代碼建立，不接任意外部message。
                except Exception: report['errors'].append('unexpected-read-failure') # 最後防線也不列任意字串或stack。
                report['elapsedMs'] = max(0, round((now() - started) * 1000)); return report # 單調耗時不是效能測試或CPU分數。
            def encoded_report(report): # 可讀單行JSON附獨立SHA/bytes供root由完整raw log核對。
                body = json.dumps(report, ensure_ascii=True, separators=(',', ':'), sort_keys=True).encode('ascii') # 固定有限欄位，沒有HTML、HAR、keys或圖片。
                if len(body) > 4096: raise Rejected('report-size-limit') # 超出4KiB不輸出部分或任意截斷報告。
                return body, hashlib.sha256(body).hexdigest() # 雜湊只核完整有限JSON，不hash原始外部錯誤。
            if __name__ == '__main__': # 只有正式workflow呼叫才讀runner；import供純mock不產副作用。
                if sys.platform != 'linux' or os.uname().machine != 'x86_64' or os.geteuid() == 0: result = {'schemaVersion': 1, 'outcome': 'blocked', 'errors': ['nonroot-linux-x64-required'], 'browserExecuted': False, 'launchAuthorized': False} # 固定OS／非root，不切換環境救援。
                else: result = collect(os.environ) # 僅讀被identity白名單選取的公開變數。
                try: body, digest = encoded_report(result) # 必須完整編碼與大小核對才輸出。
                except Rejected: body, digest = encoded_report({'schemaVersion': 1, 'outcome': 'blocked', 'errors': ['report-size-limit'], 'browserExecuted': False, 'launchAuthorized': False}) # 報告過大只留固定小錯誤，不能洩漏原內容。
                print('QA_METADATA_V1 ' + body.decode('ascii'), flush=True) # 一份最大4KiB JSON，root只讀原始job log。
                print('QA_METADATA_SHA256 ' + str(len(body)) + ' ' + digest, flush=True) # 第二行提供固定長度與SHA，不用artifact配額。
                sys.exit(0 if result.get('outcome') == 'metadata-observed-not-authorized' else 2) # 綠燈僅代表觀測完成，絕不等於可啟動browser。
        run: | # Python包含來源驗證與執行的整體最多19秒TERM再1秒KILL。
          timeout --signal=TERM --kill-after=1s 19s /usr/bin/python3 -c ' # 僅已存在系統Python，不安裝替代工具。
          import hashlib, os # 標準庫核固定內嵌來源身份。
          source = os.environ["QA_SOURCE"].encode("utf-8") # 不讀其他環境值或外部來源碼。
          assert len(source) == 12677 and hashlib.sha256(source).hexdigest() == "9698b8596953c1ea5aec051f9e89affe4ac108e39e0af1ffc174ffe1604bf2f9", "payload-integrity" # 不符就不執行、不下載救援副本。
          exec(compile(source, "reviewed-metadata.py", "exec"), {"__name__": "__main__"}) # 只執行已逐byte核過的固定公開診斷，不接受其他程式。
          ' # 結束固定shell字串，任何失敗不重試。
