        type: choice # GitHub固定選單，runtime仍核白名單。
        required: true # 不依預設推測使用者要測哪款。
        default: moss0020-backup75-known-notice # 本包只提供Moss同job私有原件還原。
        options: # 後續情境只有逐份審過才可加入。
          - moss0020-backup75-known-notice # Moss0020十五pointer與一次setFiles5/control8；硬goal不變，未知零後態。
