          import {readFile,readdir,lstat} from 'node:fs/promises'; // 中文：固定本包身份檢查，不做原生操作。
          import {createHash} from 'node:crypto'; // 中文：逐byte SHA256。
          import {fileURLToPath} from 'node:url'; // 中文：只本地固定candidate根。
          const root=new URL('../',import.meta.url),manifest=JSON.parse(await readFile(new URL('PAYLOAD-MANIFEST.json',root),'utf8')); // 中文：外層凍結manifest另固定此清單自身身份。
          async function files(url,prefix=''){const out=[];for(const e of await readdir(url,{withFileTypes:true})){const path=prefix+e.name;if(e.isSymbolicLink())throw Error('payload-link');if(e.isDirectory())out.push(...await files(new URL(e.name+'/',url),path+'/'));else if(e.isFile())out.push(path);else throw Error('payload-type');}return out;} // 中文：拒link與未知檔型，不跟隨額外目錄。
          const paths=(await files(root)).filter(p=>p!=='PAYLOAD-MANIFEST.json').sort();if(JSON.stringify(paths)!==JSON.stringify(manifest.files.map(e=>e.path).sort()))throw Error('payload-members'); // 中文：新增/刪除一樣失敗。
          for(const e of manifest.files){if(!/^[-a-zA-Z0-9_./]+$/.test(e.path)||e.path.split('/').some(x=>!x||x==='..'))throw Error('payload-path');const p=new URL(e.path,root),s=await lstat(p),b=await readFile(p);if(!s.isFile()||s.isSymbolicLink()||b.length!==e.bytes||createHash('sha256').update(b).digest('hex')!==e.sha256)throw Error('payload-identity');} // 中文：全部精確匹配才過。
          console.log(JSON.stringify({payloads:manifest.files.length,identity:'PASS',nativeExecuted:false,root:fileURLToPath(root)})); // 中文：只有本地身份結論。
