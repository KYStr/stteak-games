              const text = typeof error?.message === "string" ? error.message.slice(0, 32768) : ""; // 有界字串避免不受控錯誤訊息吃資源。
              const allowedNames = ["Error", "AbortError", "TimeoutError", "TypeError", "RangeError", "DOMException"]; const allowedCodes = ["ABORT_ERR", "ETIMEDOUT", "ENOENT", "EACCES", "EPERM", "EIO", "EBADF", "EMFILE", "ENFILE", "ENOMEM", "ERR_STREAM_PREMATURE_CLOSE", "ERR_CRYPTO_HASH_FINALIZED", "ERR_CRYPTO_HASH_UPDATE_FAILED", "ERR_OSSL_EVP_UNSUPPORTED", "ERR_INVALID_ARG_TYPE", "ERR_INVALID_ARG_VALUE", "ERR_OUT_OF_RANGE"]; // 只保留固定Node／OS錯誤碼，不收任意字串。
              const indicators = []; // 只能輸出固定類別，不保存匹配原文、路徑、PID或命令列。
