        test -x "$NODE_BIN/node" # 中文：獨立簡單命令；缺node立即停止，不受AND列表豁免set-e。
        test -x "$NODE_BIN/npm" # 中文：缺npm也立即停止，不從PATH找替代。
        export PATH="$NODE_BIN:$PATH" # 中文：同一選定Node供本job後續入口。
        test "$(node --version)" = '"'"'v24.22.1'"'"' # 中文：真正版本必須精確。
        python3 - <<'"'"'AETHER_MATERIALIZE'"'"' # 中文：只執行此workflow固定物化程式。
        import os,json,hashlib # 中文：只讀本workflow內嵌已固定bytes，不訪網路。
        from pathlib import Path # 中文：所有輸出限新目錄且拒覆寫。
        raw=os.environ['"'"'QA_FILE_INDEX'"'"'];assert hashlib.sha256(raw.encode()).hexdigest()=='"'"'c46fe8026fa7cb8f258a09cd8613eaa815723cae430b87e087999cda6f514970'"'"' # 中文：任何換路徑或hash在落檔前拒。
        entries=json.loads(raw);ready=[] # 中文：先全驗，不部分寫錯包。
        for e in entries: # 中文：索引精確固定，不由使用者提供任意path。
         b=os.environ[e['"'"'env'"'"']].encode();assert len(b)==e['"'"'bytes'"'"'] and hashlib.sha256(b).hexdigest()==e['"'"'sha256'"'"'];ready.append((e['"'"'path'"'"'],b)) # 中文：全內容先核。
        root=Path.cwd();assert root.resolve()==root;dest=root/'"'"'aether-run'"'"';assert not dest.exists() and not dest.is_symlink() # 中文：新唯一目錄，拒既有或斷鏈。
        dest.mkdir(mode=0o700) # 中文：全部通過才寫。
        for name,b in ready: # 中文：只寫已固定索引路徑。
         p=dest/name;p.parent.mkdir(parents=True,exist_ok=True) # 中文：全新根下建立相對固定路徑。
