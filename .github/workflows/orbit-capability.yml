            test('report未列圖就丟棄候選且不落盤', async () => { const mock = fixture(); const metadata = await mock.lease.capture(); await mock.lease.persistForReport({ outcome: 'blocked', screenshots: [] }, mock.writeFile); assert.equal(mock.writes.length, 0); await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /artifact-size-limit/); }); // outer timeout不能由晚到metadata補圖。
            test('report未列圖封存時pending token失效且晚回不能產生metadata', async () => { const mock = fixture({ pending: true }); const pending = mock.lease.capture(); await mock.lease.persistForReport({ outcome: 'blocked', screenshots: [] }, mock.writeFile); assert.equal(mock.lease.inFlight(), false); mock.resolve(); await assert.rejects(pending, /operation-deadline/); assert.equal(mock.writes.length, 0); assert.equal(mock.calls.length, 1); }); // helper自身即保證無圖封存後不復活，不能只靠browserclose擋晚回。
            test('從未capture的無圖封存也禁止後續啟動截圖', async () => { const mock = fixture(); await mock.lease.persistForReport({ outcome: 'blocked', screenshots: [] }, mock.writeFile); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); assert.equal(mock.calls.length, 0); assert.equal(mock.writes.length, 0); }); // late action closure不得在封存後才取得新圖片槽。
            test('外層bounded先逾時使活躍token失效且晚PNG不保存', async () => { const mock = fixture({ pending: true }); const pending = mock.lease.capture(); assert.equal(mock.lease.inFlight(), true); mock.setTime(4990); mock.lease.invalidateActive(); assert.equal(mock.fatal(), 'operation-deadline'); mock.resolve(); await assert.rejects(pending, /operation-deadline/); await mock.lease.persistForReport({ outcome: 'blocked', screenshots: [] }, mock.writeFile); assert.equal(mock.writes.length, 0); assert.equal(mock.lease.inFlight(), false); }); // 封住外層計時稍早於內層五秒的幾毫秒窗口。
            test('沒有截圖活躍時bounded逾時不改其他輸入診斷政策', () => { const mock = fixture(); mock.lease.invalidateActive(); assert.equal(mock.fatal(), null); assert.equal(mock.lease.inFlight(), false); }); // click或press未知仍可依原scenario規劃只讀收尾。
            test('自身五秒expiry即使外層未失效仍拒晚圖及metadata', async () => { const mock = fixture({ expire: true }); await assert.rejects(mock.lease.capture(), /operation-deadline/); assert.equal(mock.writes.length, 0); assert.equal(mock.fatal(), 'operation-deadline'); await mock.lease.persistForReport({ screenshots: [] }, mock.writeFile); assert.equal(mock.writes.length, 0); }); // 不借用共享80秒工作截止延長snapshot。
            test('活躍截圖未ack時即使report猜metadata亦不得保存', async () => { const mock = fixture({ pending: true }); const pending = mock.lease.capture(); const guessed = { file: 'boot.png', bytes: mock.bytes.length, sha256: createHash('sha256').update(mock.bytes).digest('hex') }; await assert.rejects(mock.lease.persistForReport(reportWith(guessed), mock.writeFile), /artifact-size-limit/); mock.lease.invalidateActive(); mock.resolve(); await assert.rejects(pending, /operation-deadline/); assert.equal(mock.writes.length, 0); }); // token有效且完整ack不可被SHA吻合替代。
            for (const key of ['file', 'bytes', 'sha256']) { // report三個身分欄位每項都必須精確一致。
              test(`report ${key}不符不寫原圖`, async () => { const mock = fixture(); const metadata = await mock.lease.capture(); await assert.rejects(mock.lease.persistForReport(reportWith({ ...metadata, [key]: key === 'bytes' ? 999 : 'mismatch' }), mock.writeFile), /artifact-size-limit/); assert.equal(mock.writes.length, 0); }); // 不容另一圖、另一檔名或假hash混入本輪。
            } // 固定boot.png不可被任意路徑替換。
            test('report列多圖或無candidate不保存', async () => { const mock = fixture(); await assert.rejects(mock.lease.persistForReport({ screenshots: [{ file: 'boot.png' }] }, mock.writeFile), /artifact-size-limit/); const metadata = await mock.lease.capture(); await assert.rejects(mock.lease.persistForReport({ screenshots: [metadata, metadata] }, mock.writeFile), /artifact-size-limit/); assert.equal(mock.writes.length, 0); }); // 唯一槽位不能從report擴成多圖。
            test('原Buffer內容若意外改動即使舊metadata相符也拒寫', async () => { const mock = fixture(); const metadata = await mock.lease.capture(); mock.bytes[0] ^= 1; await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /artifact-size-limit/); assert.equal(mock.writes.length, 0); }); // 保存前再核原bytes SHA，沒有默認信任可變Buffer。
            test('截圖前錯址不呼叫API且回root仍保持fatal', async () => { const mock = fixture(); mock.redirect(); await assert.rejects(mock.lease.capture(), /unexpected-navigation/); mock.restore(); await assert.rejects(mock.lease.capture(), /unexpected-navigation/); assert.equal(mock.calls.length, 0); }); // 不為了diagnostic讀登入頁。
            for (const [name, options, code] of [['轉址', { redirect: true }, 'unexpected-navigation'], ['pageerror', { fatal: 'pageerror-observed' }, 'pageerror-observed'], ['crash', { fatal: 'page-crash-observed' }, 'page-crash-observed']]) { // screenshot bytes回來後仍必須過原健康與目標gate。
              test(`截圖後${name}不保留可寫metadata`, async () => { const mock = fixture(options); await assert.rejects(mock.lease.capture(), new RegExp(code)); await mock.lease.persistForReport({ screenshots: [] }, mock.writeFile); assert.equal(mock.calls.length, 1); assert.equal(mock.writes.length, 0); }); // 不依賴事後傳輸器才發現錯頁。
            } // page事件與同步gate皆不會被本helper清除。
            test('截圖拒絕用掉唯一槽且不重截', async () => { const mock = fixture({ reject: true }); await assert.rejects(mock.lease.capture(), /screenshot-rejected/); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); assert.equal(mock.calls.length, 1); assert.equal(mock.writes.length, 0); }); // 正常與診斷不能各分一個圖片槽。
            test('超過二MiB拒絕不壓縮、不寫、不重截', async () => { const mock = fixture({ large: true }); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); assert.equal(mock.calls.length, 1); assert.equal(mock.writes.length, 0); }); // 小於限制才可沿原transport傳輸。
            test('host寫入失敗也不第二次落盤', async () => { const mock = fixture({ writeReject: true }); const metadata = await mock.lease.capture(); await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /host-write-rejected/); await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /artifact-size-limit/); assert.equal(mock.writes.length, 1); }); // 純host失敗不重啟browser補證據。
            test('已保存原圖不能再次保存或再次capture', async () => { const mock = fixture(); const metadata = await mock.lease.capture(); await mock.lease.persistForReport(reportWith(metadata), mock.writeFile); await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /artifact-size-limit/); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); assert.equal(mock.writes.length, 1); assert.equal(mock.calls.length, 1); }); // 成功後亦不能形成隱藏第二輪。
