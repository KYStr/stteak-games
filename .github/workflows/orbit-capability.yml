name: Orbit public-source.2 bounded story pause resume
'on':
  workflow_dispatch:
    inputs:
      confirm_native_chrome:
        description: One fresh native context, 1 navigation, story/pause/resume 3 normal clicks only; 2 PNG <=2MiB each; 2 JSON <=64KiB each; scene30/process120/job10min; single attempt
        type: boolean
        required: true
        default: false
      scenario:
        type: choice
        default: orbit-public-source2-story-pause-resume-r4
        options:
        - orbit-public-source2-story-pause-resume-r4
permissions: {}
concurrency:
  group: stteak-single-public-capability
  cancel-in-progress: false
jobs:
  probe:
    if: ${{ github.repository == 'KYStr/stteak-games' && github.repository_owner == 'KYStr' && github.actor == 'KYStr' && !github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.confirm_native_chrome && inputs.scenario == 'orbit-public-source2-story-pause-resume-r4' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      npm_config_fetch_retries: '0'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      QA_SCENARIO: orbit-public-source2-story-pause-resume-r4
      QA_CONFIRM_NATIVE_CHROME: ${{ inputs.confirm_native_chrome }}
    steps:
    - name: Prepare fixed Orbit wrapper and exact 82 public files
      id: prepare
      shell: bash
      env:
        QA_SOURCE_0: |
