            test('真正完整digest不符明確mismatch且不執行', async () => { const mock = fixture(); mock.io.hash = async () => ({ digest: 'b'.repeat(32), observation: { status: 'complete', fullyRead: true, bytesProcessed: 10, elapsedMs: 1, abortSignaled: false } }); const report = await inspectNative(mock.io); assert.equal(report.binaryIntegrity.comparison, 'mismatch'); assert.equal(report.binaryIntegrity.hash.fullyRead, true); assert.ok(!report.errors.some(x => x.check === 'packageBinaryChecksum')); assert.ok(!mock.calls.includes('version')); }); // 比較不符與I/O例外是不同結論。
            test('完整stream只讀一次且hash符合', async () => { let opens = 0; let time = 0; const signal = new AbortController().signal; const result = await hashOnce(() => { opens++; return (async function* () { yield Buffer.from('hello'); time += 3; yield Buffer.from(' world'); time += 2; })(); }, signal, () => {}, () => time); assert.equal(opens, 1); assert.equal(result.digest, createHash('md5').update('hello world').digest('hex')); assert.equal(result.observation.status, 'complete'); assert.equal(result.observation.bytesProcessed, 11); assert.equal(result.observation.elapsedMs, 5); assert.equal(result.observation.fullyRead, true); assert.equal(result.observation.abortSignaled, false); }); // 真正正式hash邏輯只用記憶體合成bytes，不碰系統binary。
            test('hash逾時保留取消原因時間與已處理bytes且不重讀', async () => { let opens = 0; let time = 0; const controller = new AbortController(); const result = await hashOnce(() => { opens++; return (async function* () { yield Buffer.alloc(7); time = HASH_LIMIT_MS; controller.abort({ name: 'TimeoutError' }); throw abortFailure(); })(); }, controller.signal, () => {}, () => time); assert.equal(opens, 1); assert.equal(result.digest, null); assert.equal(result.observation.stage, 'read-update'); assert.equal(result.observation.bytesProcessed, 7); assert.equal(result.observation.elapsedMs, HASH_LIMIT_MS); assert.equal(result.observation.fullyRead, false); assert.equal(result.observation.abortSignaled, true); assert.equal(result.observation.abortReasonName, 'TimeoutError'); assert.equal(result.observation.error.name, 'AbortError'); assert.equal(result.observation.error.errorCode, 'ABORT_ERR'); assert.ok(!JSON.stringify(result).includes('secret')); }); // 不靠總耗時猜根因，而直接保留本次signal與有限錯誤。
            test('hash取消不比較部分digest也不執行version', async () => { const mock = fixture(); mock.io.hash = async () => ({ digest: null, observation: { status: 'failed', stage: 'read-update', fullyRead: false, bytesProcessed: 7, elapsedMs: HASH_LIMIT_MS, abortSignaled: true, abortReasonName: 'TimeoutError', error: classifyAllowed(abortFailure()) } }); const report = await inspectNative(mock.io); assert.equal(report.binaryIntegrity.comparison, 'not-run'); assert.equal(report.binaryIntegrity.hash.bytesProcessed, 7); assert.equal(report.errors.find(x => x.check === 'packageBinaryChecksum').stage, 'binary-hash'); assert.ok(!mock.calls.includes('version')); }); // 不把部分hash當完整性通過或自動再讀。
            test('開stream失敗保留有限code而無原文', async () => { const result = await hashOnce(() => { const error = new Error('secret-path'); error.code = 'EIO'; throw error; }, new AbortController().signal, () => {}); assert.equal(result.observation.stage, 'open-stream'); assert.equal(result.observation.bytesProcessed, 0); assert.equal(result.observation.error.errorCode, 'EIO'); assert.ok(!JSON.stringify(result).includes('secret-path')); }); // 其他I/O失敗不會因新增Abort分類而消失。
            test('未知錯誤name與code不能成為輸出通道', () => { const result = classifyAllowed({ name: 'secret-name', code: 'secret-code', cause: { name: 'secret-cause' }, message: 'secret-message' }); assert.equal(result.name, 'other'); assert.equal(result.errorCode, null); assert.equal(result.causeName, null); assert.ok(!JSON.stringify(result).includes('secret')); }); // 僅白名單error欄位，禁止任意字串。
          QA_SOURCE_18: | # 固定原文 tests/public.test.mjs；程式逐行中文註解，JSON與LICENSE保留合法原格式。
