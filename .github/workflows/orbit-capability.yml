.test.mjs\",\"env\":\"QA_SOURCE_37\",\"bytes\":4473,\"sha256\":\"f7c52b5b1436651459daed5546f4482e198fd4acb3f45f4b2e41b135aaa04544\"},{\"path\":\"tests/local-source.test.mjs\",\"env\":\"QA_SOURCE_38\",\"bytes\":4350,\"sha256\":\"2e71dcebcd491b6918b61c84c3bd0f6c9e6131792f90d8c034e32217e521cc6e\"},{\"path\":\"tests/loopback-scope.test.mjs\",\"env\":\"QA_SOURCE_39\",\"bytes\":3054,\"sha256\":\"a4358e083d4c5c2d5dd69a29d426f94ca39ba35343493aae0337ce193e6b6bb2\"},{\"path\":\"tests/materialize.test.mjs\",\"env\":\"QA_SOURCE_40\",\"bytes\":2768,\"sha256\":\"ed59c20ab862526cd2165df68fcc96f2c593be3752e2c247bb80e0ff07d1d054\"},{\"path\":\"tests/native.test.mjs\",\"env\":\"QA_SOURCE_41\",\"bytes\":28751,\"sha256\":\"c4adbc6169b2c462c856b4ec3d1c26afa255eaea198cb2a8609ca9dd615a9f69\"},{\"path\":\"tests/navigation.test.mjs\",\"env\":\"QA_SOURCE_42\",\"bytes\":9000,\"sha256\":\"79d3d52f624dc5ccadeefe13afed12e54ff45a61e50f64d882788f3fc5337ec9\"},{\"path\":\"tests/preview-session.test.mjs\",\"env\":\"QA_SOURCE_43\",\"bytes\":6904,\"sha256\":\"8247a3d01766b9300abf0b0b0fed6561bbc4cc3d20fb805748695b142ddf1bf9\"},{\"path\":\"tests/reader.test.mjs\",\"env\":\"QA_SOURCE_44\",\"bytes\":10428,\"sha256\":\"e2e53c320f5ce60326f4daa429b4363fb5a18c8dee1e41e16022a54529f3520c\"},{\"path\":\"tests/scenario-fixture.mjs\",\"env\":\"QA_SOURCE_45\",\"bytes\":3828,\"sha256\":\"2a8716192b03e10767ca90cef45cb51ddcec88399b7fa8eb7b71fa414f6d4889\"},{\"path\":\"tests/scenario.test.mjs\",\"env\":\"QA_SOURCE_46\",\"bytes\":2389,\"sha256\":\"94803b2883648bff7d062feee61527bde3e807d26245da701560856a1b26ffd5\"},{\"path\":\"tests/snapshot-boundary.test.mjs\",\"env\":\"QA_SOURCE_47\",\"bytes\":1547,\"sha256\":\"ca01bd013770969dc8998fd9b444bdf61ad1e9fadd143d0207506d8dacb7b1a1\"},{\"path\":\"tests/transport-v2.test.mjs\",\"env\":\"QA_SOURCE_48\",\"bytes\":3301,\"sha256\":\"4b1a4ef9ee1e245a6c62f2aec9008ee03766d92c9bc28a310445cf229a56a1e7\"}]" # 路徑、長度與SHA必須全部先通過。
        run: | # 僅執行純materializer，新28秒TERM加2秒KILL。
          timeout --signal=TERM --kill-after=2s 28s node --input-type=module -e 'import {mkdir,writeFile,readFile,lstat,realpath} from '"'"'node:fs/promises'"'"'; // 匯入本地固定依賴與純函式，載入本行不執行瀏覽器。
          import {createHash} from '"'"'node:crypto'"'"';import {resolve,dirname,relative} from '"'"'node:path'"'"'; // 匯入本地固定依賴與純函式，載入本行不執行瀏覽器。
          export const ALLOWED=Object.freeze(["LICENSE","package-lock.json","package.json","scripts/check.mjs","scripts/comment-contract.mjs","scripts/core.mjs","scripts/diagnostics.mjs","scripts/emit-evidence.mjs","scripts/entry-documents.mjs","scripts/final-seal.mjs","scripts/gate.mjs","scripts/identity-epochs.mjs","scripts/local/loopback.mjs","scripts/local/preview-session.mjs","scripts/local/runtime-contract.mjs","scripts/local/runtime-receipt.json","scripts/local/runtime-source.mjs","scripts/local/source-contract.mjs","scripts/log-transfer.mjs","scripts/materialize.mjs","scripts/native.mjs","scripts/navigation.mjs","scripts/probe.mjs","scripts/scenario-boundary.mjs","scripts/select-scenario.mjs","scripts/signal/key-lease.mjs","scripts/signal/playwright-adapter.mjs","scripts/signal/route.mjs","scripts/signal/scenario.mjs","scripts/signal/target.mjs","scripts/signal/visible-reader.mjs","tests/adapter.test.mjs","tests/comment-contract.test.mjs","tests/core-scope.test.mjs","tests/entry-documents.test.mjs","tests/final-seal.test.mjs","tests/key-lease.test.mjs","tests/local-input.test.mjs","tests/local-source.test.mjs","tests/loopback-scope.test.mjs","tests/materialize.test.mjs","tests/native.test.mjs","tests/navigation.test.mjs","tests/preview-session.test.mjs","tests/reader.test.mjs","tests/scenario-fixture.mjs","tests/scenario.test.mjs","tests/snapshot-boundary.test.mjs","tests/transport-v2.test.mjs"]); // 內嵌檔案全清單先驗雜湊，再以不覆寫方式落檔並逐位元組讀回。
          export async function materialize(raw,env,root=process.cwd()){ // 內嵌檔案全清單先驗雜湊，再以不覆寫方式落檔並逐位元組讀回。
           const index=JSON.parse(raw);if(!Array.isArray(index)||index.length!==ALLOWED.length)throw Error('"'"'payload-index-shape'"'"'); // 先驗清單形狀與精確長度，缺檔、多檔或非法資料在落檔前拒絕。
           const files=index.map((entry,i)=>{if(!entry||Object.keys(entry).sort().join('"'"','"'"')!=='"'"'bytes,env,path,sha256'"'"'||entry.path!==ALLOWED[i]||entry.env!=='"'"'QA_SOURCE_'"'"'+i||!Number.isInteger(entry.bytes)||entry.bytes<1||entry.bytes>65536||!/^[a-f0-9]{64}$/.test(entry.sha256)||typeof env[entry.env]!=='"'"'string'"'"')throw Error('"'"'payload-entry-shape'"'"');const bytes=Buffer.from(env[entry.env],'"'"'utf8'"'"');if(bytes.length!==entry.bytes||createHash('"'"'sha256'"'"').update(bytes).digest('"'"'hex'"'"')!==entry.sha256)throw Error('"'"'payload-integrity'"'"');return{entry,bytes};}); // 全部來源先核固定路徑、變數序號、位元組與SHA，再容許任何寫入。
           const base=resolve(root),stat=await lstat(base);if(!stat.isDirectory()||stat.isSymbolicLink()||await realpath(base)!==base)throw Error('"'"'payload-root'"'"'); // 實際根目錄必須是非符號連結的目錄，不能由路徑別名跳出工作區。
           for(const {entry,bytes} of files){const target=resolve(base,entry.path);if(relative(base,target)!==entry.path)throw Error('"'"'payload-path'"'"');let dir=base;for(const part of dirname(entry.path).split('"'"'/'"'"').filter(p=>p!=='"'"'.'"'"')){dir+='"'"'/'"'"'+part;try{await mkdir(dir);}catch(e){if(e.code!=='"'"'EEXIST'"'"')throw e;}const s=await lstat(dir);if(!s.isDirectory()||s.isSymbolicLink())throw Error('"'"'payload-directory'"'"');}await writeFile(target,bytes,{flag:'"'"'wx'"'"'});if(!(await readFile(target)).equals(bytes))throw Error('"'"'payload-readback'"'"');} // 每層目錄拒絕符號連結，檔案以wx拒絕覆寫並核回讀完全相同。
           return {files:files.length,bytes:files.reduce((n,f)=>n+f.bytes.length,0)}; // 內嵌檔案全清單先驗雜湊，再以不覆寫方式落檔並逐位元組讀回。
          } // 結束目前有限區塊，失敗不新增重試或備援路徑。
          console.log(JSON.stringify(await materialize(process.env.QA_FILE_INDEX,process.env))); // 全部逐byte讀回後才輸出有限統計。
          ' # 結束固定模組，不插環境值成shell。
      - name: Cheap gates and pure mocks first # 先離線否證，失敗不啟動瀏覽器。
        run: timeout --signal=TERM --kill-after=2s 58s bash -e -c 'node scripts/gate.mjs && node scripts/select-scenario.mjs && npm run check && npm test' # 先離線否證，失敗不啟動瀏覽器。
      - name: Acquire one exact public runtime package or fail closed # commit空在mkdir及GET前拒絕，無轉址／重試／認證。
        run: timeout --signal=TERM --kill-after=2s 28s node scripts/local/runtime-source.mjs # 一次取回驗包落檔回讀共30秒硬界。
      - name: Install exact official test dependency # 僅公開npmregistry的兩個鎖版套件。
        run: timeout --signal=TERM --kill-after=3s 117s npm ci --ignore-scripts --no-audit --no-fund # 不執行依賴安裝script，不配置登入token。
      - name: Install only official Ubuntu CJK font # 僅字型與fontconfig既有快取觸發，不裝browser或改任何安全設定。
        timeout-minutes: 2 # 此步驟最多兩分鐘；失敗不進browser。
        run: | # 所有來源只在本job臨時清單，保持原生系統apt安全驗證。
          FONT_ROOT="$RUNNER_TEMP/qa-official-font" # 固定本job臨時目錄，不修改/etc/apt來源。
          mkdir -p "$FONT_ROOT/lists/partial" # 僅建立本次Ubuntu套件索引暫存。
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main' > "$FONT_ROOT/source.list" # 只信Ubuntu既有archive keyring與官方noble/main，不加入第三方來源。
          APT_SCOPE=(-o "Dir::Etc::sourcelist=$FONT_ROOT/source.list" -o 'Dir::Etc::sourceparts=-' -o "Dir::State::lists=$FONT_ROOT/lists" -o 'Dir::Cache::pkgcache=' -o 'Dir::Cache::srcpkgcache=' -o 'Acquire::Retries=0' -o 'Acquire::http::Timeout=20' -o 'Acquire::https::Timeout=20') # 命令局部來源與零重試，不削弱套件簽章或TLS。
          timeout --signal=TERM --kill-after=3s 45s sudo apt-get "${APT_SCOPE[@]}" update # 一次官方索引更新，逾時即停，不對所有runner第三方repo更新。
          timeout --signal=TERM --kill-after=3s 60s sudo apt-get "${APT_SCOPE[@]}" install -y --no-install-recommends --no-install-suggests --no-upgrade --no-remove 'fonts-noto-cjk=1:20230817+repack1-3' # 只安裝固定無Depends字型包，不升級既有套件、不裝extra字重。
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3' # 安裝後核實際版本，缺失或不同即停止。
          fc-match -f '%{family}\n' ':lang=zh-tw' # 只印非敏感字族供回查；最終仍須原PNG確認中文不是tofu。
      - name: One sandbox WebGL2 and reviewed scenario # 能力不足即blocked，不使用危險旗標或重開browser。
        id: capability # 供結果回讀識別，不觸發下游長測。
        run: timeout --signal=TERM --kill-after=5s 545s node scripts/probe.mjs # 同一程序群組545秒TERM、再5秒KILL，上界550秒。
      - name: Emit only bounded public evidence to raw log # 不使用upload-artifact、不使用cache，日誌只含本輪公開圖及短報告。
        if: ${{ !cancelled() && steps.capability.outcome != 'skipped' && steps.capability.outcome != '' }} # 只有probe真的開始才輸出；前置安裝失敗不補造結果。
        run: timeout --signal=TERM --kill-after=2s 28s node scripts/emit-evidence.mjs # 逐塊等待stdout寫完；缺圖／缺報告／SHA不符即失敗，不再開browser。
