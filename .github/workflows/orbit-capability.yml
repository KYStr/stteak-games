            test('exact156完整原安全gate過才ready且只限新Neon profile', async () => { const m = fixture('', {}, PROFILES.neon156); const r = await inspectNative(m.io); assert.equal(r.status, 'ready'); assert.equal(profileFromReport(r), PROFILES.neon156); assert.equal(r.profile.mode, 'neon-readability0013-desktop1600-scenario'); assert.equal(r.version, '156.0.8078.47'); assert.equal(r.binaryIntegrity.comparison, 'match'); assert.equal(m.calls.filter(v => v === 'package').length, 1); assert.equal(m.calls.filter(v => v === 'version').length, 1); assert.equal(r.image.status, 'pending-content-verification'); assert.equal(r.image.exactImageContentsVerified, false); assert.equal(r.image.installedBinaryBoundToOfficialDeb, false); assert.equal(r.image.actual, null); }); // ready不代表來源缺口消失或Neon設定指標已實測通過。
            for (const key of [...PATHS.map(x => x.key), 'kernel', 'package', 'binaryOwner', 'profileOwner', NATIVE.sums, NATIVE.profile, 'binary-hash', 'profileSums', 'local', '/etc/apparmor.d/disable/chrome', '/etc/apparmor.d/force-complain/chrome', 'version']) test(`156亦保原不可信${key}阻擋`, async () => { const m = fixture(key, {}, PROFILES.neon156), r = await inspectNative(m.io); assert.equal(r.status, 'blocked'); assert.equal(profileFromReport(r), null); if (key !== 'version') assert.ok(!m.calls.includes('version')); }); // 新版不移除任何來源／安全核對，失敗不是落回155。
            for (const key of ['google-chrome-stable', 'amd64', 'install ok installed', 'Chrome Linux Team']) test(`156 metadata ${key}不符零hash/version`, async () => { const m = fixture('', {}, PROFILES.neon156), command = m.io.command; m.io.command = async name => name === 'package' ? metadata.replace(NATIVE.packageVersion, PROFILES.neon156.packageVersion).replace(key, 'unknown') : command(name); const r = await inspectNative(m.io); assert.equal(r.status, 'blocked'); assert.equal(r.profile, null); assert.ok(!m.calls.includes('binary-hash')); assert.ok(!m.calls.includes('version')); }); // 不能只看Version單欄就認官方身份。
