name: Crown input3 independent bounded menu lifecycle # 中文：本地候選，不代表批准或已執行。
on: # 中文：只保留既有手動入口，沒有自動觸發。
  workflow_dispatch: # 中文：根統籌未另決策前不得派發。
    inputs: # 中文：不接受任意URL、flags、路線或額外檔案。
      confirm_native_chrome: # 中文：固定新scope明示確認，不沿其他遊戲授權。
        description: 'Crown menu only: 11 planned clicks; 0 keys/PNG; caps14 clicks/50 reads; 115s work/120s process; no timeout fallback' # 中文：原界線如實列出。
        type: boolean # 中文：不能用非空字串猜同意。
        default: false # 中文：預設不執行。
        required: true # 中文：由root掌控後續派發。
      scenario: # 中文：只有本次固定可見前綴。
        type: choice # 中文：不提供輸入任意路徑。
        default: crown-input3-menu-lifecycle # 中文：不是全遊戲通關。
        options: # 中文：單一選項，不連跑其他遊戲。
          - crown-input3-menu-lifecycle # 中文：教學/失焦/設定/取消正常路線。
permissions: {} # 中文：無repo寫入或token權限。
concurrency: # 中文：沿既有單runner群組。
  group: stteak-single-public-capability # 中文：不建平行矩陣。
  cancel-in-progress: false # 中文：不得取消既有run。
jobs: # 中文：只有標準runner一個job。
  probe: # 中文：所有前置加傳輸最多10分鐘提案，native process仍120秒；尚未執行。
    if: ${{ github.repository == 'KYStr/stteak-games' && github.repository_owner == 'KYStr' && github.actor == 'KYStr' && !github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.confirm_native_chrome }} # 中文：固定owner/main/首輪手動。
    runs-on: ubuntu-24.04 # 中文：沿既有公開標準Linux，不用larger/self-hosted。
    timeout-minutes: 10 # 中文：setup/dependency/font/log皆有外層界，非增加遊戲路線時長。
    env: # 中文：沒有任何secret或憑證。
      QA_REPOSITORY_PRIVATE: ${{ github.event.repository.private }} # 中文：真事件公開性。
      QA_CONFIRM_NATIVE_CHROME: ${{ inputs.confirm_native_chrome }} # 中文：明示布林。
      QA_SCENARIO: ${{ inputs.scenario }} # 中文：runtime再核精確scope。
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # 中文：不能安裝替代browser。
      npm_config_fetch_retries: '0' # 中文：不追加重試。
      npm_config_audit: 'false' # 中文：不增加無關網路。
      npm_config_fund: 'false' # 中文：不增加無關網路。
    steps: # 中文：不checkout、不cache、不upload-artifact。
      - name: Fixed official Node without credentials # 中文：沿既有完整action SHA。
        timeout-minutes: 2 # 中文：setup有限，不會延長native120秒。
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 中文：固定官方Node action。
        with: # 中文：不提供token或cache。
          node-version: '24.22.1' # 中文：同原loopback門檻。
          token: '' # 中文：不取新憑證。
          package-manager-cache: false # 中文：不沿用其他候選狀態。
      - name: Materialize exact reviewed Crown runner # 中文：29文字來源含明示modified dependency，尚待整體獨核。
        env: # 中文：公開固定程式與授權文字，無秘密。
