            const indicators = []; // 只能輸出固定類別，不保存匹配原文、路徑、PID或命令列。
            if (/Chromium sandboxing failed!|No usable sandbox!|crbug\.com\/(?:357670|638180)/.test(text)) indicators.push("sandbox-failure-reported"); // 官方Playwright／Chromium明確訊號，仍不宣稱已知道是哪個OS策略造成。
