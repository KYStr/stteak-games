            test("錯run或錯commit拒絕", () => { const data = sample(); assert.throws(() => decodeTransfers(data.lines.join("\n"), { ...expected, runId: "999" })); assert.throws(() => decodeTransfers(data.lines.join("\n"), { ...expected, commit: "b".repeat(40) })); }); // 防止舊圖或別的執行混入。
            test("重複完整stream拒絕", () => { const data = sample(); assert.throws(() => decodeTransfers([...data.lines, ...data.lines].join("\n"), expected)); }); // 不接受合併多個run的日誌。
            test("只有圖或成功報告缺圖拒絕", () => { const data = sample(); assert.throws(() => decodeTransfers(encodeTransfer("png", data.png, expected).join("\n"), expected)); assert.throws(() => decodeTransfers(encodeTransfer("report", data.report, expected).join("\n"), expected)); }); // 綠燈、圖片與報告不能彼此替代。
            test("只有shell回顯標記不算真stream", () => assert.throws(() => decodeTransfers("console.log(\"QA_TRANSFER_V1 ...\")", expected))); // 行內程式文字不當執行證據。
            test("PNG簽名錯誤拒絕", () => { const data = sample(); data.png[0] = 1; const report = Buffer.from(JSON.stringify({ outcome: "evidence-collected-pending-review", screenshots: [{ file: "boot.png", bytes: data.png.length, sha256: hash(data.png) }] })); assert.throws(() => decodeTransfers([...encodeTransfer("report", report, expected), ...encodeTransfer("png", data.png, expected)].join("\n"), expected)); }); // 任意二進位資料不能冒稱原始PNG。
            test("超過log上限拒絕", () => assert.throws(() => decodeTransfers("x".repeat(TRANSFER.logLimit + 1), expected))); // 本地回收本身也有資源上限。
            test("未承諾的image env不當成啟動必要條件", () => { assert.deepEqual(inspectGate(allowed), []); assert.deepEqual(inspectGate({ ...allowed, ImageOS: "unknown", ImageVersion: "unknown" }), []); }); // image真實身份由root綁定當輪官方header核，不假填期望值。
          QA_FILE_INDEX: | # JSON逐欄：path相對檔名、env來源變數、bytes位元組長度、sha256內容校驗；不是執行指令。
            [{"path":"package.json","env":"QA_SOURCE_0","bytes":392,"sha256":"f0ac519f2f9ff827e77abea1847960536d335a632ff0d622d9ec730e8c704331"},{"path":"package-lock.json","env":"QA_SOURCE_1","bytes":1304,"sha256":"ad9529218d95135e68e6fee10d2da9d46be786aee53af5e59eb9d2db97b15849"},{"path":"LICENSE","env":"QA_SOURCE_2","bytes":1063,"sha256":"4bfd79f924dfe8db584210eaf1adff63fb41d4e3c02fceb12216118f731f86a3"},{"path":"scripts/core.mjs","env":"QA_SOURCE_3","bytes":10772,"sha256":"f095725ff47230bd4d2671bfa4793ef055ad70204a43f374ee9f3bcc1996384e"},{"path":"scripts/select-scenario.mjs","env":"QA_SOURCE_4","bytes":1277,"sha256":"333709316b52a909c2c92eb4535dcef0b0fd99a9cfce4a5fe2989ab0b51b2e25"},{"path":"scripts/scenario-neon.mjs","env":"QA_SOURCE_5","bytes":16077,"sha256":"55a87cc81d76c1b8f2f0bbaf9b393a107688a1d5b3d5322b9699ded75a03592a"},{"path":"scripts/entry-documents.mjs","env":"QA_SOURCE_6","bytes":14530,"sha256":"f7871fc41e7e19276be8a49fdeef09c499dff2117d8501e01a447d285cfb08df"},{"path":"scripts/scenario-boundary.mjs","env":"QA_SOURCE_7","bytes":5514,"sha256":"5bcd4ee64596538cfcc479b449812134656fde3310b782bd8d34ebd48481021b"},{"path":"scripts/diagnostics.mjs","env":"QA_SOURCE_8","bytes":4635,"sha256":"0d1f2988ccca9523488d0a8f12ac929071c61f6ba3b218db92eb66b0d5c8f763"},{"path":"scripts/native.mjs","env":"QA_SOURCE_9","bytes":22603,"sha256":"d8395d526761e4f393b6bac72f9653c44c94cac29a487881b0a2ac1b8793c994"},{"path":"scripts/gate.mjs","env":"QA_SOURCE_10","bytes":2934,"sha256":"4665e5f2a404ea8bd90ee52df6979e9129523c7eae89d4ba2b0b0f104251cbaa"},{"path":"scripts/probe.mjs","env":"QA_SOURCE_11","bytes":16408,"sha256":"91687ac9d569079950659f56b302a480525bd315a7eb1385ec5432692fb9e763"},{"path":"scripts/log-transfer.mjs","env":"QA_SOURCE_12","bytes":7615,"sha256":"a8d65f1da2d0a556b1d352e17570b337357dda7348b2b3d6b6bb2dbb2dd6736d"},{"path":"scripts/emit-evidence.mjs","env":"QA_SOURCE_13","bytes":1987,"sha256":"a865fda7646a03b4c6258cea7efdabb54bbcb197e66cb2ed5200c7038b389b20"},{"path":"scripts/check.mjs","env":"QA_SOURCE_14","bytes":2689,"sha256":"eb5321c3e295bb0d50a639bd671374a180e21c55e2817e68b27aa36537b4ea54"},{"path":"tests/core.test.mjs","env":"QA_SOURCE_15","bytes":15808,"sha256":"2500021e634b6ad727d20e5f4482afd101e31c4117d6f2ec6badc41f139cb141"},{"path":"tests/dual-profile.test.mjs","env":"QA_SOURCE_16","bytes":16955,"sha256":"1ae45008f7fae2a1fc0ca9bc4bd645aabeacf1c8e9e2b65ed823fb133681cded"},{"path":"tests/desktop-profile.test.mjs","env":"QA_SOURCE_17","bytes":2197,"sha256":"6e1bc2dd57292db515ac86a4db0422fbd9eac732ab558a0ffc9239bb17c66c5a"},{"path":"tests/neon.test.mjs","env":"QA_SOURCE_18","bytes":13064,"sha256":"e27c473a4adcd700c6d57b711d5868c35173fc5b32203e394abb2cd4c54d65c5"},{"path":"tests/entry-documents.test.mjs","env":"QA_SOURCE_19","bytes":22109,"sha256":"1fbecd948ef36b55d1d51e864f063d80c16ae94cdccf2d89b10ed917624f2b45"},{"path":"tests/neon-source-layout.test.mjs","env":"QA_SOURCE_20","bytes":25820,"sha256":"bbae081dfebbfb9d13006a9e57486ee4cc3b124ddc05671e377f1dd36c3b57c3"},{"path":"tests/scenario-boundary.test.mjs","env":"QA_SOURCE_21","bytes":25916,"sha256":"6966363698ec361f15412556d1bd2bdb4d99b9bbce29833f57f5e8f2060e861f"},{"path":"tests/native.test.mjs","env":"QA_SOURCE_22","bytes":23735,"sha256":"558a35748920a336826d9fedf4336fb6c8d452ee382407683501abe5419bbae8"},{"path":"tests/public.test.mjs","env":"QA_SOURCE_23","bytes":8123,"sha256":"ca01a8f31baec18f6490b352fff28f50dadf72f1017862b776424ac5f843f595"}]
        run: | # 下列shell與JavaScript每行均有中文解釋；只做逐byte校驗及臨時檔生成。
          node --input-type=module -e ' // 使用固定Node與標準模組，不執行外部下載程式。
          import { mkdir, writeFile, readFile } from "node:fs/promises"; // 檔案只寫本工作目錄。
          import { createHash } from "node:crypto"; // 每個原文字節都核SHA256。
          import { dirname } from "node:path"; // 僅為固定相對檔名建立目錄。
          const entries = JSON.parse(process.env.QA_FILE_INDEX); // JSON欄位path/env/bytes/sha256分別是檔名、來源變數、長度與校驗值。
          for (const entry of entries) { // 僅走內嵌固定清單，不讀repo或其他檔案。
            if (!/^(?:scripts|tests)\/[a-z.-]+\.mjs$|^package(?:-lock)?\.json$|^LICENSE$/.test(entry.path)) throw new Error("invalid-payload-path"); // 不接受絕對路徑或路徑穿越。
            const bytes = Buffer.from(process.env[entry.env], "utf8"); // 保留YAML literal的原始文字與最後換行，不trim、不重排JSON。
            if (bytes.length !== entry.bytes || createHash("sha256").update(bytes).digest("hex") !== entry.sha256) throw new Error("payload-integrity"); // 貼上、編碼或換行錯誤立即阻擋，不能下載救援副本。
            await mkdir(dirname(entry.path), { recursive: true }); await writeFile(entry.path, bytes, { flag: "wx" }); // 工作區應為乾淨新runner，拒絕覆蓋未知檔。
            if (!(await readFile(entry.path)).equals(bytes)) throw new Error("payload-readback"); // 再從實際檔案逐byte讀回，才允許後續測試。
            console.log(JSON.stringify({ payloadFile: entry.path, bytes: entry.bytes, sha256: entry.sha256 })); // 僅輸出公開測試碼身份，不輸出秘密。
          } // 全部固定payload已核對。
          ' # 結束單引號shell參數，沒有here-doc未註解分隔行。
      - name: Cheap gates and pure mocks first # 先便宜否證，不通過就不下載套件或browser。
        run: node scripts/gate.mjs && node scripts/select-scenario.mjs && npm run check && npm test # 全部語法／mock只用記憶體，不連網或建立真PNG。
      - name: Install exact official test dependency # 僅公開npmregistry的兩個鎖版套件。
        run: npm ci --ignore-scripts --no-audit --no-fund # 不執行依賴安裝script，不配置登入token。
      - name: Install only official Ubuntu CJK font # 僅字型與fontconfig既有快取觸發，不裝browser或改任何安全設定。
        timeout-minutes: 2 # 此步驟最多兩分鐘；失敗不進browser。
        run: | # 所有來源只在本job臨時清單，保持原生系統apt安全驗證。
          FONT_ROOT="$RUNNER_TEMP/qa-official-font" # 固定本job臨時目錄，不修改/etc/apt來源。
          mkdir -p "$FONT_ROOT/lists/partial" # 僅建立本次Ubuntu套件索引暫存。
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main' > "$FONT_ROOT/source.list" # 只信Ubuntu既有archive keyring與官方noble/main，不加入第三方來源。
          APT_SCOPE=(-o "Dir::Etc::sourcelist=$FONT_ROOT/source.list" -o 'Dir::Etc::sourceparts=-' -o "Dir::State::lists=$FONT_ROOT/lists" -o 'Dir::Cache::pkgcache=' -o 'Dir::Cache::srcpkgcache=' -o 'Acquire::Retries=0' -o 'Acquire::http::Timeout=20' -o 'Acquire::https::Timeout=20') # 命令局部來源與零重試，不削弱套件簽章或TLS。
          timeout --signal=TERM --kill-after=3s 45s sudo apt-get "${APT_SCOPE[@]}" update # 一次官方索引更新，逾時即停，不對所有runner第三方repo更新。
          timeout --signal=TERM --kill-after=3s 60s sudo apt-get "${APT_SCOPE[@]}" install -y --no-install-recommends --no-install-suggests --no-upgrade --no-remove 'fonts-noto-cjk=1:20230817+repack1-3' # 只安裝固定無Depends字型包，不升級既有套件、不裝extra字重。
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3' # 安裝後核實際版本，缺失或不同即停止。
          fc-match -f '%{family}\n' ':lang=zh-tw' # 只印非敏感字族供回查；最終仍須原PNG確認中文不是tofu。
      - name: One sandbox WebGL2 and reviewed scenario # 能力不足即blocked，不使用危險旗標或重開browser。
        id: capability # 供結果回讀識別，不觸發下游長測。
        run: timeout --signal=TERM --kill-after=5s 110s node scripts/probe.mjs # 同一程序群組一百一十秒TERM、再五秒KILL，上界一百十五秒。
      - name: Emit only bounded public evidence to raw log # 不使用upload-artifact、不使用cache，日誌只含本輪公開圖及短報告。
        if: ${{ !cancelled() && steps.capability.outcome != 'skipped' && steps.capability.outcome != '' }} # 只有probe真的開始才輸出；前置安裝失敗不補造結果。
        run: node scripts/emit-evidence.mjs # 逐塊等待stdout寫完；缺圖／缺報告／SHA不符即失敗，不再開browser。
