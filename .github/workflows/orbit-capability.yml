            test('正常close後report精確列圖才host保存原Buffer', async () => { const mock = fixture(); const metadata = await mock.lease.capture(); mock.close(); await mock.lease.persistForReport(reportWith(metadata), mock.writeFile); assert.equal(mock.writes.length, 1); assert.equal(mock.writes[0].file, 'artifacts/boot.png'); assert.equal(mock.writes[0].value, mock.bytes); assert.equal(mock.calls.length, 1); }); // host保存不再healthy或browserAPI，不被closed誤擋。
            test('合法blocked診斷圖已ack且report列圖可保存', async () => { const mock = fixture(); const metadata = await mock.lease.capture(); mock.close(); await mock.lease.persistForReport(reportWith(metadata, 'blocked'), mock.writeFile); assert.equal(mock.writes.length, 1); }); // blocked不等於沒有合法只讀證據，但不升格產品成功。
            test('report未列圖就丟棄候選且不落盤', async () => { const mock = fixture(); const metadata = await mock.lease.capture(); await mock.lease.persistForReport({ outcome: 'blocked', screenshots: [] }, mock.writeFile); assert.equal(mock.writes.length, 0); await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /artifact-size-limit/); }); // outer timeout不能由晚到metadata補圖。
            test('report未列圖封存時pending token失效且晚回不能產生metadata', async () => { const mock = fixture({ pending: true }); const pending = mock.lease.capture(); await mock.lease.persistForReport({ outcome: 'blocked', screenshots: [] }, mock.writeFile); assert.equal(mock.lease.inFlight(), false); mock.resolve(); await assert.rejects(pending, /operation-deadline/); assert.equal(mock.writes.length, 0); assert.equal(mock.calls.length, 1); }); // helper自身即保證無圖封存後不復活，不能只靠browserclose擋晚回。
            test('從未capture的無圖封存也禁止後續啟動截圖', async () => { const mock = fixture(); await mock.lease.persistForReport({ outcome: 'blocked', screenshots: [] }, mock.writeFile); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); assert.equal(mock.calls.length, 0); assert.equal(mock.writes.length, 0); }); // late action closure不得在封存後才取得新圖片槽。
            test('外層bounded先逾時使活躍token失效且晚PNG不保存', async () => { const mock = fixture({ pending: true }); const pending = mock.lease.capture(); assert.equal(mock.lease.inFlight(), true); mock.setTime(7990); mock.lease.invalidateActive(); assert.equal(mock.fatal(), 'operation-deadline'); mock.resolve(); await assert.rejects(pending, /operation-deadline/); await mock.lease.persistForReport({ outcome: 'blocked', screenshots: [] }, mock.writeFile); assert.equal(mock.writes.length, 0); assert.equal(mock.lease.inFlight(), false); }); // 封住外層計時稍早於內層八秒的幾毫秒窗口。
            test('沒有截圖活躍時bounded逾時不改其他輸入診斷政策', () => { const mock = fixture(); mock.lease.invalidateActive(); assert.equal(mock.fatal(), null); assert.equal(mock.lease.inFlight(), false); }); // click或press未知仍可依原scenario規劃只讀收尾。
            test('自身八秒expiry即使外層未失效仍拒晚圖及metadata', async () => { const mock = fixture({ expire: true }); await assert.rejects(mock.lease.capture(), /operation-deadline/); assert.equal(mock.writes.length, 0); assert.equal(mock.fatal(), 'operation-deadline'); await mock.lease.persistForReport({ screenshots: [] }, mock.writeFile); assert.equal(mock.writes.length, 0); }); // 不借用共享80秒工作截止延長snapshot。
            test('活躍截圖未ack時即使report猜metadata亦不得保存', async () => { const mock = fixture({ pending: true }); const pending = mock.lease.capture(); const guessed = { file: 'boot.png', bytes: mock.bytes.length, sha256: createHash('sha256').update(mock.bytes).digest('hex') }; await assert.rejects(mock.lease.persistForReport(reportWith(guessed), mock.writeFile), /artifact-size-limit/); mock.lease.invalidateActive(); mock.resolve(); await assert.rejects(pending, /operation-deadline/); assert.equal(mock.writes.length, 0); }); // token有效且完整ack不可被SHA吻合替代。
            for (const key of ['file', 'bytes', 'sha256']) { // report三個身分欄位每項都必須精確一致。
              test(`report ${key}不符不寫原圖`, async () => { const mock = fixture(); const metadata = await mock.lease.capture(); await assert.rejects(mock.lease.persistForReport(reportWith({ ...metadata, [key]: key === 'bytes' ? 999 : 'mismatch' }), mock.writeFile), /artifact-size-limit/); assert.equal(mock.writes.length, 0); }); // 不容另一圖、另一檔名或假hash混入本輪。
            } // 固定boot.png不可被任意路徑替換。
            test('report列多圖或無candidate不保存', async () => { const mock = fixture(); await assert.rejects(mock.lease.persistForReport({ screenshots: [{ file: 'boot.png' }] }, mock.writeFile), /artifact-size-limit/); const metadata = await mock.lease.capture(); await assert.rejects(mock.lease.persistForReport({ screenshots: [metadata, metadata] }, mock.writeFile), /artifact-size-limit/); assert.equal(mock.writes.length, 0); }); // 唯一槽位不能從report擴成多圖。
            test('原Buffer內容若意外改動即使舊metadata相符也拒寫', async () => { const mock = fixture(); const metadata = await mock.lease.capture(); mock.bytes[0] ^= 1; await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /artifact-size-limit/); assert.equal(mock.writes.length, 0); }); // 保存前再核原bytes SHA，沒有默認信任可變Buffer。
            test('截圖前錯址不呼叫API且回root仍保持fatal', async () => { const mock = fixture(); mock.redirect(); await assert.rejects(mock.lease.capture(), /unexpected-navigation/); mock.restore(); await assert.rejects(mock.lease.capture(), /unexpected-navigation/); assert.equal(mock.calls.length, 0); }); // 不為了diagnostic讀登入頁。
            for (const [name, options, code] of [['轉址', { redirect: true }, 'unexpected-navigation'], ['pageerror', { fatal: 'pageerror-observed' }, 'pageerror-observed'], ['crash', { fatal: 'page-crash-observed' }, 'page-crash-observed']]) { // screenshot bytes回來後仍必須過原健康與目標gate。
              test(`截圖後${name}不保留可寫metadata`, async () => { const mock = fixture(options); await assert.rejects(mock.lease.capture(), new RegExp(code)); await mock.lease.persistForReport({ screenshots: [] }, mock.writeFile); assert.equal(mock.calls.length, 1); assert.equal(mock.writes.length, 0); }); // 不依賴事後傳輸器才發現錯頁。
            } // page事件與同步gate皆不會被本helper清除。
            test('截圖拒絕用掉唯一槽且不重截', async () => { const mock = fixture({ reject: true }); await assert.rejects(mock.lease.capture(), /screenshot-rejected/); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); assert.equal(mock.calls.length, 1); assert.equal(mock.writes.length, 0); }); // 正常與診斷不能各分一個圖片槽。
            test('超過二MiB拒絕不壓縮、不寫、不重截', async () => { const mock = fixture({ large: true }); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); assert.equal(mock.calls.length, 1); assert.equal(mock.writes.length, 0); }); // 小於限制才可沿原transport傳輸。
            test('host寫入失敗也不第二次落盤', async () => { const mock = fixture({ writeReject: true }); const metadata = await mock.lease.capture(); await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /host-write-rejected/); await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /artifact-size-limit/); assert.equal(mock.writes.length, 1); }); // 純host失敗不重啟browser補證據。
            test('已保存原圖不能再次保存或再次capture', async () => { const mock = fixture(); const metadata = await mock.lease.capture(); await mock.lease.persistForReport(reportWith(metadata), mock.writeFile); await assert.rejects(mock.lease.persistForReport(reportWith(metadata), mock.writeFile), /artifact-size-limit/); await assert.rejects(mock.lease.capture(), /artifact-size-limit/); assert.equal(mock.writes.length, 1); assert.equal(mock.calls.length, 1); }); // 成功後亦不能形成隱藏第二輪。
          QA_FILE_INDEX: | # JSON逐欄：path相對檔名、env來源變數、bytes位元組長度、sha256內容校驗；不是執行指令。
            [{"path":"package.json","env":"QA_SOURCE_0","bytes":392,"sha256":"f0ac519f2f9ff827e77abea1847960536d335a632ff0d622d9ec730e8c704331"},{"path":"package-lock.json","env":"QA_SOURCE_1","bytes":1304,"sha256":"ad9529218d95135e68e6fee10d2da9d46be786aee53af5e59eb9d2db97b15849"},{"path":"LICENSE","env":"QA_SOURCE_2","bytes":1063,"sha256":"4bfd79f924dfe8db584210eaf1adff63fb41d4e3c02fceb12216118f731f86a3"},{"path":"scripts/core.mjs","env":"QA_SOURCE_3","bytes":10376,"sha256":"e721f6f4c15bb8fc41de8d30cdb4f9f6bf706bcfc8d93903d891c9707f91ae4d"},{"path":"scripts/select-scenario.mjs","env":"QA_SOURCE_4","bytes":790,"sha256":"4f961070592b19498e5dec1d28d4444ec074896f160427825767bdb4bd39f6b1"},{"path":"scripts/scenario-crown.mjs","env":"QA_SOURCE_5","bytes":28147,"sha256":"7e74396dd9496704457c2b7480686e2e5934410ded8d3928d6b62ddf6c4527a9"},{"path":"scripts/scenario-health.mjs","env":"QA_SOURCE_6","bytes":1433,"sha256":"ff3dd8340db7f1da07838853038a9c4ca253b341d04f6db2d0608890020c6075"},{"path":"scripts/snapshot-lease.mjs","env":"QA_SOURCE_7","bytes":4185,"sha256":"515f3092518205a0b28587d757c88310d1b5cd64ebe5313e611934b5e8d0781e"},{"path":"scripts/diagnostics.mjs","env":"QA_SOURCE_8","bytes":4635,"sha256":"0d1f2988ccca9523488d0a8f12ac929071c61f6ba3b218db92eb66b0d5c8f763"},{"path":"scripts/native.mjs","env":"QA_SOURCE_9","bytes":22532,"sha256":"b3ac98c628baa6ef7d87a94640d7d69587f01500dd3086caa28bd94b75099dbc"},{"path":"scripts/gate.mjs","env":"QA_SOURCE_10","bytes":2934,"sha256":"4665e5f2a404ea8bd90ee52df6979e9129523c7eae89d4ba2b0b0f104251cbaa"},{"path":"scripts/probe.mjs","env":"QA_SOURCE_11","bytes":15490,"sha256":"ab5f8e5e718caebb534479a65c2c6a2ead384c19828052c6a57ef6b697198bbd"},{"path":"scripts/log-transfer.mjs","env":"QA_SOURCE_12","bytes":7615,"sha256":"a8d65f1da2d0a556b1d352e17570b337357dda7348b2b3d6b6bb2dbb2dd6736d"},{"path":"scripts/emit-evidence.mjs","env":"QA_SOURCE_13","bytes":1987,"sha256":"a865fda7646a03b4c6258cea7efdabb54bbcb197e66cb2ed5200c7038b389b20"},{"path":"scripts/check.mjs","env":"QA_SOURCE_14","bytes":2689,"sha256":"eb5321c3e295bb0d50a639bd671374a180e21c55e2817e68b27aa36537b4ea54"},{"path":"tests/core.test.mjs","env":"QA_SOURCE_15","bytes":15047,"sha256":"00626fa1c2b77ee614b05c9163aa31b7387a61ad6c3e76a89ff82cff32666fec"},{"path":"tests/crown.test.mjs","env":"QA_SOURCE_16","bytes":33144,"sha256":"0b94070052400f302431b1561e23485b67943db772e191795f79a1a513bd21bb"},{"path":"tests/native.test.mjs","env":"QA_SOURCE_17","bytes":23739,"sha256":"b8727dc24cba7dcd1d2f960b8c471970c9a609af1816b824ea044ed4b9972fc3"},{"path":"tests/dual-profile.test.mjs","env":"QA_SOURCE_18","bytes":19117,"sha256":"18169e5c34eded94383e35bb705acd9b96e32b3d09df569152414ba5810744fa"},{"path":"tests/public.test.mjs","env":"QA_SOURCE_19","bytes":8123,"sha256":"ca01a8f31baec18f6490b352fff28f50dadf72f1017862b776424ac5f843f595"},{"path":"tests/integration.test.mjs","env":"QA_SOURCE_20","bytes":29283,"sha256":"5ddd0a5c6a682ba4d7df697097084edab6ab8fa24922c6f6f8f06b4438c1ef87"},{"path":"tests/snapshot-lease.test.mjs","env":"QA_SOURCE_21","bytes":11396,"sha256":"77a3ee2df466c98b9bb56b6996a64109d88c969d959fd309b5fb0c1456aa82e5"}]
        run: | # 下列shell與JavaScript每行均有中文解釋；只做逐byte校驗及臨時檔生成。
          node --input-type=module -e ' // 使用固定Node與標準模組，不執行外部下載程式。
          import { mkdir, writeFile, readFile } from "node:fs/promises"; // 檔案只寫本工作目錄。
          import { createHash } from "node:crypto"; // 每個原文字節都核SHA256。
          import { dirname } from "node:path"; // 僅為固定相對檔名建立目錄。
          const entries = JSON.parse(process.env.QA_FILE_INDEX); // JSON欄位path/env/bytes/sha256分別是檔名、來源變數、長度與校驗值。
          for (const entry of entries) { // 僅走內嵌固定清單，不讀repo或其他檔案。
            if (!/^(?:scripts|tests)\/[a-z.-]+\.mjs$|^package(?:-lock)?\.json$|^LICENSE$/.test(entry.path)) throw new Error("invalid-payload-path"); // 不接受絕對路徑或路徑穿越。
            const bytes = Buffer.from(process.env[entry.env], "utf8"); // 保留YAML literal的原始文字與最後換行，不trim、不重排JSON。
            if (bytes.length !== entry.bytes || createHash("sha256").update(bytes).digest("hex") !== entry.sha256) throw new Error("payload-integrity"); // 貼上、編碼或換行錯誤立即阻擋，不能下載救援副本。
            await mkdir(dirname(entry.path), { recursive: true }); await writeFile(entry.path, bytes, { flag: "wx" }); // 工作區應為乾淨新runner，拒絕覆蓋未知檔。
            if (!(await readFile(entry.path)).equals(bytes)) throw new Error("payload-readback"); // 再從實際檔案逐byte讀回，才允許後續測試。
            console.log(JSON.stringify({ payloadFile: entry.path, bytes: entry.bytes, sha256: entry.sha256 })); // 僅輸出公開測試碼身份，不輸出秘密。
          } // 全部固定payload已核對。
          ' # 結束單引號shell參數，沒有here-doc未註解分隔行。
      - name: Cheap gates and pure mocks first # 先便宜否證，不通過就不下載套件或browser。
        run: node scripts/gate.mjs && node scripts/select-scenario.mjs && npm run check && npm test # 全部語法／mock只用記憶體，不連網或建立真PNG。
      - name: Install exact official test dependency # 僅公開npmregistry的兩個鎖版套件。
        run: npm ci --ignore-scripts --no-audit --no-fund # 不執行依賴安裝script，不配置登入token。
      - name: Install only official Ubuntu CJK font # 僅字型與fontconfig既有快取觸發，不裝browser或改任何安全設定。
        timeout-minutes: 2 # 此步驟最多兩分鐘；失敗不進browser。
        run: | # 所有來源只在本job臨時清單，保持原生系統apt安全驗證。
          FONT_ROOT="$RUNNER_TEMP/qa-official-font" # 固定本job臨時目錄，不修改/etc/apt來源。
          mkdir -p "$FONT_ROOT/lists/partial" # 僅建立本次Ubuntu套件索引暫存。
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main' > "$FONT_ROOT/source.list" # 只信Ubuntu既有archive keyring與官方noble/main，不加入第三方來源。
          APT_SCOPE=(-o "Dir::Etc::sourcelist=$FONT_ROOT/source.list" -o 'Dir::Etc::sourceparts=-' -o "Dir::State::lists=$FONT_ROOT/lists" -o 'Dir::Cache::pkgcache=' -o 'Dir::Cache::srcpkgcache=' -o 'Acquire::Retries=0' -o 'Acquire::http::Timeout=20' -o 'Acquire::https::Timeout=20') # 命令局部來源與零重試，不削弱套件簽章或TLS。
          timeout --signal=TERM --kill-after=3s 45s sudo apt-get "${APT_SCOPE[@]}" update # 一次官方索引更新，逾時即停，不對所有runner第三方repo更新。
          timeout --signal=TERM --kill-after=3s 60s sudo apt-get "${APT_SCOPE[@]}" install -y --no-install-recommends --no-install-suggests --no-upgrade --no-remove 'fonts-noto-cjk=1:20230817+repack1-3' # 只安裝固定無Depends字型包，不升級既有套件、不裝extra字重。
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3' # 安裝後核實際版本，缺失或不同即停止。
          fc-match -f '%{family}\n' ':lang=zh-tw' # 只印非敏感字族供回查；最終仍須原PNG確認中文不是tofu。
      - name: One sandbox WebGL2 and reviewed scenario # 能力不足即blocked，不使用危險旗標或重開browser。
        id: capability # 供結果回讀識別，不觸發下游長測。
        run: timeout --signal=TERM --kill-after=5s 110s node scripts/probe.mjs # 同一程序群組110秒TERM、再5秒KILL，上界115秒，105工作界已先停止。
      - name: Emit only bounded public evidence to raw log # 不使用upload-artifact、不使用cache，日誌只含本輪公開圖及短報告。
        if: ${{ !cancelled() && steps.capability.outcome != 'skipped' && steps.capability.outcome != '' }} # 只有probe真的開始才輸出；前置安裝失敗不補造結果。
        run: node scripts/emit-evidence.mjs # 逐塊等待stdout寫完；缺圖／缺報告／SHA不符即失敗，不再開browser。
