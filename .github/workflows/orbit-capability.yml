        description: 'New scope: fixed synthetic1106-byte JSON import and reload; not OS chooser; process115s, job12min; one run' # 固定新情境的手動入口與權限，不沿用舊執行批准。
        type: boolean # 用明確布林選項，避免字串歧義。
        default: false # 預設不執行。
        required: true # 必須由owner明確確認。
      scenario: # 每輪只能選一個已審遊戲情境，沒有矩陣或連續跑四款。
        description: '7 pointer inputs, one fixed Buffer FileChooser.setFiles, one reload, one PNG; no retry or race claim' # 固定新情境的手動入口與權限，不沿用舊執行批准。
        type: choice # GitHub固定選單，runtime仍核白名單。
        required: true # 不依預設推測使用者要測哪款。
        default: moss0022-synthetic-import-reload # 本包只提供固定day2合成檔正常匯入與同頁reload保存。
        options: # 後續情境只有逐份審過才可加入。
          - moss0022-synthetic-import-reload # 7pointer、1固定file、1reload；兩entry A/B，讀回slot1/day2，唯一末圖。
permissions: {} # 不checkout、不讀寫GitHub內容、不給token任何可選scope。
concurrency: # 所有分支共用固定群組，沒有矩陣或分片。
  group: stteak-single-public-capability # 最多一個正在執行的probe。
  cancel-in-progress: false # 新派發不干擾既有證據；不要主動排第二輪。
jobs: # 只有一個標準runner job。
