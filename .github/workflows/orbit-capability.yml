    - name: Install only official Ubuntu CJK font within 120 seconds
      id: font
      shell: bash
      timeout-minutes: 2
      run: |
        timeout --signal=TERM --kill-after=3s 117s bash -euo pipefail -c 'set -euo pipefail # 中文：任何前置或安裝失敗立即退出，不進原生也不重試。
        FONT_ROOT="$(mktemp -d /tmp/aether-public-font.XXXXXXXXXX)" # 中文：只新建本job公開套件暫存，防名稱碰撞且不沿RUNNER_TEMP。
        printf '"'"'%s\n'"'"' '"'"'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main'"'"' > "$FONT_ROOT/source.list" # 中文：只既有官方keyring及noble/main，沒有第三方或私資料。
        sudo chown root:root "$FONT_ROOT" "$FONT_ROOT/source.list" # 中文：僅新根與公開來源檔交root持有，不改既有路徑。
        sudo chmod 0755 "$FONT_ROOT" # 中文：僅新根允許_apt穿越與讀取，不放寬/tmp或RUNNER_TEMP。
        sudo chmod 0644 "$FONT_ROOT/source.list" # 中文：只有公開來源清單可讀，無憑證。
        sudo install -d -o root -g root -m 0755 "$FONT_ROOT/lists" "$FONT_ROOT/archives" # 中文：只本job公開索引及deb父目錄，其他使用者不可寫。
        sudo install -d -o _apt -g root -m 0700 "$FONT_ROOT/lists/partial" "$FONT_ROOT/archives/partial" # 中文：下載sandbox只在兩個新partial具寫權，不停sandbox。
        APT_SCOPE=(-o "Dir::Etc::sourcelist=$FONT_ROOT/source.list" -o '"'"'Dir::Etc::sourceparts=-'"'"' -o "Dir::State::lists=$FONT_ROOT/lists" -o "Dir::Cache::archives=$FONT_ROOT/archives" -o '"'"'Dir::Cache::pkgcache='"'"' -o '"'"'Dir::Cache::srcpkgcache='"'"' -o '"'"'Acquire::Retries=0'"'"' -o '"'"'Acquire::http::Timeout=20'"'"' -o '"'"'Acquire::https::Timeout=20'"'"') # 中文：局部來源/公開快取/零重試，保持原簽章TLS及_apt預設。
        timeout --signal=TERM --kill-after=3s 45s sudo apt-get "${APT_SCOPE[@]}" update # 中文：唯一索引更新，45秒TERM加3秒KILL仍受整步界。
        timeout --signal=TERM --kill-after=3s 60s sudo apt-get "${APT_SCOPE[@]}" install -y --no-install-recommends --no-install-suggests --no-upgrade --no-remove '"'"'fonts-noto-cjk=1:20230817+repack1-3'"'"' # 中文：只固定字型，不裝extra/瀏覽器或換版本。
        FONT_VERSION="$(dpkg-query -W -f='"'"'${Version}'"'"' fonts-noto-cjk)" # 中文：獨立賦值繼承同次查詢退出碼，非零立即停，不讓test吞掉失敗。
        test "$FONT_VERSION" = '"'"'1:20230817+repack1-3'"'"' # 中文：只有查詢成功再比固定版本，仍同整步界且不重查。
        fc-match -f '"'"'%{family}\n'"'"' '"'"':lang=zh-tw'"'"' # 中文：只有限字族事實，非中文畫面驗收；仍在整步117加3秒內。
        ' # 中文：建目錄/安裝/版本與字族核共同120秒，不續界。
    - name: One Aether owned-tree supervised prefix
      id: aether
      working-directory: aether-run
      shell: bash
      run: |
        timeout --signal=TERM --kill-after=1s 604s python3 scripts/supervisor.py # 中文：外層先起時計只更嚴，不延長內層600/604/605。
    - name: Emit bounded original Aether evidence
      if: ${{ !cancelled() && steps.aether.outcome != 'skipped' && steps.aether.outcome != '' }}
      working-directory: aether-run
      shell: bash
      run: |
        timeout --signal=TERM --kill-after=1s 14s node scripts/emit-evidence.mjs # 中文：收證合計最多15秒，原PNG不轉碼、不使用新artifact服務。
