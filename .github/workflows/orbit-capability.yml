              const lease = createSnapshotLease({ page: () => page, healthy, latch, now: () => time }); const writeFile = async (file, value) => { writes.push({ file, value }); if (options.writeReject) throw new Error('host-write-rejected'); }; // host保存也只是記憶體帳本，沒有檔案副作用。
              return { lease, calls, writes, bytes, writeFile, setTime: value => { time = value; }, close: () => { closed = true; }, redirect: () => { url = 'login'; }, restore: () => { url = 'public-root'; }, fatal: () => fatal, resolve: () => resolvePending?.(bytes), reject: () => rejectPending?.(new Error('late-rejected')) }; // 控制晚回順序而不使用真實睡眠或browser。
            } // 每次獨立token，沒有重用或重試入口。
