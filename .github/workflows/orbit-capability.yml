            test('未知ACK後晚resolve不能修改封存或送第二輸入',async()=>{const f=fixture();let release,pending=false;f.io.click=async(_,mark)=>{mark();pending=true;await new Promise(resolve=>{release=resolve;});};f.io.bounded=async action=>{const p=action();if(pending){pending=false;void p.catch(()=>{});throw Object.assign(new Error('timeout'),{name:'TimeoutError'});}return p;};const r=await f.run(),before=JSON.stringify(r);release();await Promise.resolve();await Promise.resolve();assert.equal(JSON.stringify(r),before);assert.equal(r.counts.inputAttempts,1);assert.equal(r.actions[0].ack,'pending');}); // 不追認晚ACK，不擴成重試。
