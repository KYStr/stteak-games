            test("固定公開主分支首次手動派發可通過閘門", () => assert.deepEqual(inspectGate(allowed), [])); // 只測授權前提，不宣稱browser可用。
            for (const key of Object.keys(allowed)) test(`缺少${key}必須阻擋`, () => assert.ok(inspectGate({ ...allowed, [key]: "" }).length)); // 每項身份、分支、公開性與確認都不可省略。
            for (const [key, value] of [["QA_REPOSITORY_PRIVATE", "true"], ["GITHUB_RUN_ATTEMPT", "2"], ["GITHUB_REF", "refs/heads/other"], ["GITHUB_REPOSITORY", "Someone/stteak-games"], ["GITHUB_ACTOR", "Someone"], ["QA_MODE", "long"]]) test(`${key}錯值阻擋`, () => assert.ok(inspectGate({ ...allowed, [key]: value }).length)); // 私有、重跑、fork、非owner與長測不能走同一入口。
            const expected = identity(allowed); // 回收端假定此身份來自獨立讀回，不從stream猜。
            const hash = value => createHash("sha256").update(value).digest("hex"); // 只核合成測試資料完整性。
            function sample(bytes = 9000) { // 合成PNG格式簽名字節，不是實際畫面，不落地成png檔。
              const png = Buffer.alloc(bytes, 37); Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]).copy(png); // 檔頭只能測傳輸簽名，不能當有效圖片或遊戲證據。
              const report = Buffer.from(JSON.stringify({ outcome: "evidence-collected-pending-review", screenshots: [{ file: "boot.png", bytes: png.length, sha256: hash(png) }] })); // 假報告僅存在測試記憶體內。
              const lines = [...encodeTransfer("report", report, expected), ...encodeTransfer("png", png, expected)]; return { png, report, lines }; // 每個stream都帶同一合成run身份。
            } // 無API請求、沒有真截圖。
            test("有時間戳及一般log時可精確回收原bytes", () => { const data = sample(); const log = ["setup output", ...data.lines.map(line => "2026-10-27T08:00:00.1234567Z " + line), "normal footer"].join("\r\n"); const result = decodeTransfers(log, expected); assert.deepEqual(result.outputs.png.bytes, data.png); assert.deepEqual(result.outputs.report.bytes, data.report); }); // 接受官方rawlog時間前綴，不依靠UI文字截取。
            test("二MiB上界可完整往返且每行小於四千三百字元", () => { const data = sample(TRANSFER.pngLimit); assert.ok(data.lines.slice(1).every(line => line.length < 4300)); assert.deepEqual(decodeTransfers(data.lines.join("\n"), expected).outputs.png.bytes, data.png); }); // 最大合法圖只測合成記憶體資料，不消耗runner或artifact額度。
            test("過大PNG與報告一律拒絕", () => { assert.throws(() => encodeTransfer("png", Buffer.alloc(TRANSFER.pngLimit + 1), expected)); assert.throws(() => encodeTransfer("report", Buffer.alloc(TRANSFER.reportLimit + 1), expected)); }); // 不偷偷多圖分輪或改畫質。
            test("blocked無PNG可回收且不冒稱有圖", () => { const bytes = Buffer.from(JSON.stringify({ outcome: "blocked", faults: ["webgl-unavailable"], screenshots: [] })); const result = decodeTransfers(encodeTransfer("report", bytes, expected).join("\n"), expected); assert.equal(result.report.outcome, "blocked"); assert.equal(result.outputs.png, undefined); }); // 能力失敗即停，不硬拿遊戲圖。
            test("缺一塊拒絕", () => { const data = sample(); const index = data.lines.findIndex(line => line.startsWith("QA_CHUNK_V1 png 2/")); data.lines.splice(index, 1); assert.throws(() => decodeTransfers(data.lines.join("\n"), expected)); }); // 不因首尾存在就接受中間缺圖資料。
            test("重複塊拒絕", () => { const data = sample(); const index = data.lines.findIndex(line => line.startsWith("QA_CHUNK_V1 png 1/")); data.lines.splice(index, 0, data.lines[index]); assert.throws(() => decodeTransfers(data.lines.join("\n"), expected)); }); // 不自動去重掩蓋來源問題。
            test("亂序拒絕", () => { const data = sample(); const index = data.lines.findIndex(line => line.startsWith("QA_CHUNK_V1 png 1/")); [data.lines[index], data.lines[index + 1]] = [data.lines[index + 1], data.lines[index]]; assert.throws(() => decodeTransfers(data.lines.join("\n"), expected)); }); // 不靠重新排序掩蓋log回收不完整。
            test("末尾截斷拒絕", () => { const data = sample(); data.lines.pop(); assert.throws(() => decodeTransfers(data.lines.join("\n"), expected)); }); // 必須看見完整結尾與精確SHA。
            test("GitHub秘密遮罩或UI省略字元拒絕", () => { const data = sample(); const index = data.lines.findIndex(line => line.startsWith("QA_CHUNK_V1 png 1/")); data.lines[index] = data.lines[index].slice(0, -3) + "***"; assert.throws(() => decodeTransfers(data.lines.join("\n"), expected)); }); // 無法回復時回報傳輸blocked，不再測遊戲。
            test("合法base64字元被改仍以SHA拒絕", () => { const data = sample(); const index = data.lines.findIndex(line => line.startsWith("QA_CHUNK_V1 png 1/")); data.lines[index] = data.lines[index].slice(0, -1) + (data.lines[index].endsWith("A") ? "B" : "A"); assert.throws(() => decodeTransfers(data.lines.join("\n"), expected)); }); // 不是只看base64可解碼就接受。
            test("錯run或錯commit拒絕", () => { const data = sample(); assert.throws(() => decodeTransfers(data.lines.join("\n"), { ...expected, runId: "999" })); assert.throws(() => decodeTransfers(data.lines.join("\n"), { ...expected, commit: "b".repeat(40) })); }); // 防止舊圖或別的執行混入。
            test("重複完整stream拒絕", () => { const data = sample(); assert.throws(() => decodeTransfers([...data.lines, ...data.lines].join("\n"), expected)); }); // 不接受合併多個run的日誌。
            test("只有圖或成功報告缺圖拒絕", () => { const data = sample(); assert.throws(() => decodeTransfers(encodeTransfer("png", data.png, expected).join("\n"), expected)); assert.throws(() => decodeTransfers(encodeTransfer("report", data.report, expected).join("\n"), expected)); }); // 綠燈、圖片與報告不能彼此替代。
            test("只有shell回顯標記不算真stream", () => assert.throws(() => decodeTransfers("console.log(\"QA_TRANSFER_V1 ...\")", expected))); // 行內程式文字不當執行證據。
            test("PNG簽名錯誤拒絕", () => { const data = sample(); data.png[0] = 1; const report = Buffer.from(JSON.stringify({ outcome: "evidence-collected-pending-review", screenshots: [{ file: "boot.png", bytes: data.png.length, sha256: hash(data.png) }] })); assert.throws(() => decodeTransfers([...encodeTransfer("report", report, expected), ...encodeTransfer("png", data.png, expected)].join("\n"), expected)); }); // 任意二進位資料不能冒稱原始PNG。
            test("超過log上限拒絕", () => assert.throws(() => decodeTransfers("x".repeat(TRANSFER.logLimit + 1), expected))); // 本地回收本身也有資源上限。
            test("未承諾的image env不當成啟動必要條件", () => { assert.deepEqual(inspectGate(allowed), []); assert.deepEqual(inspectGate({ ...allowed, ImageOS: "unknown", ImageVersion: "unknown" }), []); }); // image真實身份由root綁定當輪官方header核，不假填期望值。
          QA_FILE_INDEX: | # JSON逐欄：path相對檔名、env來源變數、bytes位元組長度、sha256內容校驗；不是執行指令。
            [{"path":"package.json","env":"QA_SOURCE_0","bytes":392,"sha256":"f0ac519f2f9ff827e77abea1847960536d335a632ff0d622d9ec730e8c704331"},{"path":"package-lock.json","env":"QA_SOURCE_1","bytes":1304,"sha256":"ad9529218d95135e68e6fee10d2da9d46be786aee53af5e59eb9d2db97b15849"},{"path":"LICENSE","env":"QA_SOURCE_2","bytes":1063,"sha256":"4bfd79f924dfe8db584210eaf1adff63fb41d4e3c02fceb12216118f731f86a3"},{"path":"scripts/core.mjs","env":"QA_SOURCE_3","bytes":9319,"sha256":"a55a01d4b55d65421787e3eea8f6df562982b2cf8e870ee80f74f7b88261714f"},{"path":"scripts/select-scenario.mjs","env":"QA_SOURCE_4","bytes":801,"sha256":"23992923a0addbda2e22eabc64c65fcacd079caad8f81dd1b9de7eb4ada98995"},{"path":"scripts/scenario-health.mjs","env":"QA_SOURCE_5","bytes":1400,"sha256":"1f052168e806d84fdb0a178f089c82844e69fb5f2828adb61d9e69c167791c0c"},{"path":"scripts/snapshot-lease.mjs","env":"QA_SOURCE_6","bytes":4185,"sha256":"822bdd3e15b3329439ebbd48ae47c50f23afd9a5764f85af379d2ccd0e222ade"},{"path":"scripts/moss/scenario.mjs","env":"QA_SOURCE_7","bytes":14425,"sha256":"544afba75e36e51222bb52692f8cadacd194e48782552dcf3e32b1a05d9de4d9"},{"path":"scripts/moss/playwright-adapter.mjs","env":"QA_SOURCE_8","bytes":9553,"sha256":"573aa6c25aeac434af861ba12c463fbff86db3d167d42141231f80cdb152e816"},{"path":"scripts/moss/tests/scenario.test.mjs","env":"QA_SOURCE_9","bytes":15078,"sha256":"edef7719d3d33319ec8804a24cc8c2942c7e7fa3cbd5a4244819deb9513a3dcf"},{"path":"scripts/moss/tests/adapter.test.mjs","env":"QA_SOURCE_10","bytes":7374,"sha256":"03c82198aade8f4fc3064c26af2d9dd1d962fabd8eea95158501a8395d8c9e58"},{"path":"scripts/diagnostics.mjs","env":"QA_SOURCE_11","bytes":4635,"sha256":"0d1f2988ccca9523488d0a8f12ac929071c61f6ba3b218db92eb66b0d5c8f763"},{"path":"scripts/native.mjs","env":"QA_SOURCE_12","bytes":17168,"sha256":"d888c91cd59f57a34503498da3cc23dfe3a80c6a1e3b1c785c921a898e94653c"},{"path":"scripts/gate.mjs","env":"QA_SOURCE_13","bytes":2934,"sha256":"4665e5f2a404ea8bd90ee52df6979e9129523c7eae89d4ba2b0b0f104251cbaa"},{"path":"scripts/probe.mjs","env":"QA_SOURCE_14","bytes":14241,"sha256":"6efaab9a18cb98fae9814418573d50c5d7545e62f7d741b672dba0e0144711ae"},{"path":"scripts/log-transfer.mjs","env":"QA_SOURCE_15","bytes":7615,"sha256":"a8d65f1da2d0a556b1d352e17570b337357dda7348b2b3d6b6bb2dbb2dd6736d"},{"path":"scripts/emit-evidence.mjs","env":"QA_SOURCE_16","bytes":1987,"sha256":"a865fda7646a03b4c6258cea7efdabb54bbcb197e66cb2ed5200c7038b389b20"},{"path":"scripts/check.mjs","env":"QA_SOURCE_17","bytes":2775,"sha256":"0c6bde8096239bf507b7522853c38b9febf55c4178cfe7c5dcef795a44ba285e"},{"path":"tests/core.test.mjs","env":"QA_SOURCE_18","bytes":11669,"sha256":"7840eedf50b46d2dde7845e6fab41018d13ad8983ece462783b124b4e0fdef23"},{"path":"tests/moss.test.mjs","env":"QA_SOURCE_19","bytes":276,"sha256":"7f88cbaa3d62a05038a9eff7deb9905d7c1828c4bed85bd6fdff2ab7293573fc"},{"path":"tests/moss-integration.test.mjs","env":"QA_SOURCE_20","bytes":11686,"sha256":"6bb5e3e4df599b588c17fe55cdc3fbe530fbd67ea840c0e161fc59e8c3fe12c2"},{"path":"tests/snapshot-lease.test.mjs","env":"QA_SOURCE_21","bytes":11396,"sha256":"93fd38668c2e836c931c6292a1bad63dbe1edd00a3acdb5c8d6d8d574dacab1c"},{"path":"tests/native.test.mjs","env":"QA_SOURCE_22","bytes":15041,"sha256":"6128047028c9b7dbd583fe6fdeededc59e814b80c30ef9188c56d38526ba78f1"},{"path":"tests/public.test.mjs","env":"QA_SOURCE_23","bytes":8123,"sha256":"ca01a8f31baec18f6490b352fff28f50dadf72f1017862b776424ac5f843f595"}]
        run: | # 下列shell與JavaScript每行均有中文解釋；只做逐byte校驗及臨時檔生成。
          node --input-type=module -e ' // 使用固定Node與標準模組，不執行外部下載程式。
          import { mkdir, writeFile, readFile } from "node:fs/promises"; // 檔案只寫本工作目錄。
          import { createHash } from "node:crypto"; // 每個原文字節都核SHA256。
          import { dirname } from "node:path"; // 僅為固定相對檔名建立目錄。
          const entries = JSON.parse(process.env.QA_FILE_INDEX); // JSON欄位path/env/bytes/sha256分別是檔名、來源變數、長度與校驗值。
          for (const entry of entries) { // 僅走內嵌固定清單，不讀repo或其他檔案。
            const mossPaths = ["scripts/moss/scenario.mjs", "scripts/moss/playwright-adapter.mjs", "scripts/moss/tests/scenario.test.mjs", "scripts/moss/tests/adapter.test.mjs"]; // 只增四個已審固定子路徑，不放寬為任意子目錄。
            if (!/^(?:scripts|tests)\/[a-z.-]+\.mjs$|^package(?:-lock)?\.json$|^LICENSE$/.test(entry.path) && !mossPaths.includes(entry.path)) throw new Error("invalid-payload-path"); // 不接受絕對路徑、未知子目錄或路徑穿越。
            const bytes = Buffer.from(process.env[entry.env], "utf8"); // 保留YAML literal的原始文字與最後換行，不trim、不重排JSON。
            if (bytes.length !== entry.bytes || createHash("sha256").update(bytes).digest("hex") !== entry.sha256) throw new Error("payload-integrity"); // 貼上、編碼或換行錯誤立即阻擋，不能下載救援副本。
            await mkdir(dirname(entry.path), { recursive: true }); await writeFile(entry.path, bytes, { flag: "wx" }); // 工作區應為乾淨新runner，拒絕覆蓋未知檔。
            if (!(await readFile(entry.path)).equals(bytes)) throw new Error("payload-readback"); // 再從實際檔案逐byte讀回，才允許後續測試。
            console.log(JSON.stringify({ payloadFile: entry.path, bytes: entry.bytes, sha256: entry.sha256 })); // 僅輸出公開測試碼身份，不輸出秘密。
          } // 全部固定payload已核對。
          ' # 結束單引號shell參數，沒有here-doc未註解分隔行。
      - name: Cheap gates and pure mocks first # 先便宜否證，不通過就不下載套件或browser。
        run: node scripts/gate.mjs && node scripts/select-scenario.mjs && npm run check && npm test # 全部語法／mock只用記憶體，不連網或建立真PNG。
      - name: Install exact official test dependency # 僅公開npmregistry的兩個鎖版套件。
        run: npm ci --ignore-scripts --no-audit --no-fund # 不執行依賴安裝script，不配置登入token。
      - name: Install only official Ubuntu CJK font # 僅字型與fontconfig既有快取觸發，不裝browser或改任何安全設定。
        timeout-minutes: 2 # 此步驟最多兩分鐘；失敗不進browser。
        run: | # 所有來源只在本job臨時清單，保持原生系統apt安全驗證。
          FONT_ROOT="$RUNNER_TEMP/qa-official-font" # 固定本job臨時目錄，不修改/etc/apt來源。
          mkdir -p "$FONT_ROOT/lists/partial" # 僅建立本次Ubuntu套件索引暫存。
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main' > "$FONT_ROOT/source.list" # 只信Ubuntu既有archive keyring與官方noble/main，不加入第三方來源。
          APT_SCOPE=(-o "Dir::Etc::sourcelist=$FONT_ROOT/source.list" -o 'Dir::Etc::sourceparts=-' -o "Dir::State::lists=$FONT_ROOT/lists" -o 'Dir::Cache::pkgcache=' -o 'Dir::Cache::srcpkgcache=' -o 'Acquire::Retries=0' -o 'Acquire::http::Timeout=20' -o 'Acquire::https::Timeout=20') # 命令局部來源與零重試，不削弱套件簽章或TLS。
          timeout --signal=TERM --kill-after=3s 45s sudo apt-get "${APT_SCOPE[@]}" update # 一次官方索引更新，逾時即停，不對所有runner第三方repo更新。
          timeout --signal=TERM --kill-after=3s 60s sudo apt-get "${APT_SCOPE[@]}" install -y --no-install-recommends --no-install-suggests --no-upgrade --no-remove 'fonts-noto-cjk=1:20230817+repack1-3' # 只安裝固定無Depends字型包，不升級既有套件、不裝extra字重。
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3' # 安裝後核實際版本，缺失或不同即停止。
          fc-match -f '%{family}\n' ':lang=zh-tw' # 只印非敏感字族供回查；最終仍須原PNG確認中文不是tofu。
      - name: One sandbox WebGL2 and reviewed scenario # 能力不足即blocked，不使用危險旗標或重開browser。
        id: capability # 供結果回讀識別，不觸發下游長測。
        run: timeout --signal=TERM --kill-after=5s 85s node scripts/probe.mjs # 同一程序群組八十五秒TERM、再五秒KILL，上界九十秒。
      - name: Emit only bounded public evidence to raw log # 不使用upload-artifact、不使用cache，日誌只含本輪公開圖及短報告。
        if: ${{ !cancelled() && steps.capability.outcome != 'skipped' && steps.capability.outcome != '' }} # 只有probe真的開始才輸出；前置安裝失敗不補造結果。
        run: node scripts/emit-evidence.mjs # 逐塊等待stdout寫完；缺圖／缺報告／SHA不符即失敗，不再開browser。
