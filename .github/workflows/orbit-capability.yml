            test('ready結果缺profile或混版不可被核心默認舊版', async () => { const m = fixture('', {}, PROFILES.neon156), r = await inspectNative(m.io); for (const change of [{ profile: null }, { version: PROFILES.game155.version }, { expectedVersion: PROFILES.game155.version }, { packageObservation: { packageVersion: PROFILES.game155.packageVersion } }, { profile: { ...r.profile, mode: 'reviewed-game' } }]) assert.equal(profileFromReport({ ...r, ...change }), null); }); // profile不是任意字串控制權。
          QA_SOURCE_21: | # 固定原文 tests/public.test.mjs；程式逐行中文註解，JSON與LICENSE保留合法原格式。
