            test('新場景與核准八秒core精確SHA及其餘b091凍結信任面一致', async () => { const expected = { 'scripts/scenario-crown.mjs': '0cd6456efa9a6ce5a7c98d57f4d3096418a5ac020a6bfaffcb5b45a5eadb8776', 'scripts/core.mjs': '16d969a207970a501dd9e68b7dc3f00fe65196d7ff7e7f959eb1c0e490e7b79b', 'scripts/native.mjs': 'd888c91cd59f57a34503498da3cc23dfe3a80c6a1e3b1c785c921a898e94653c', 'scripts/diagnostics.mjs': '0d1f2988ccca9523488d0a8f12ac929071c61f6ba3b218db92eb66b0d5c8f763', 'scripts/gate.mjs': '4665e5f2a404ea8bd90ee52df6979e9129523c7eae89d4ba2b0b0f104251cbaa', 'scripts/log-transfer.mjs': 'a8d65f1da2d0a556b1d352e17570b337357dda7348b2b3d6b6bb2dbb2dd6736d', 'scripts/emit-evidence.mjs': 'a865fda7646a03b4c6258cea7efdabb54bbcb197e66cb2ed5200c7038b389b20', 'scripts/check.mjs': 'eb5321c3e295bb0d50a639bd671374a180e21c55e2817e68b27aa36537b4ea54', 'package.json': 'f0ac519f2f9ff827e77abea1847960536d335a632ff0d622d9ec730e8c704331', 'package-lock.json': 'ad9529218d95135e68e6fee10d2da9d46be786aee53af5e59eb9d2db97b15849', 'tests/core.test.mjs': '7840eedf50b46d2dde7845e6fab41018d13ad8983ece462783b124b4e0fdef23', 'tests/native.test.mjs': '6128047028c9b7dbd583fe6fdeededc59e814b80c30ef9188c56d38526ba78f1', 'tests/public.test.mjs': 'ca01a8f31baec18f6490b352fff28f50dadf72f1017862b776424ac5f843f595' }; for (const [path, expectedSha] of Object.entries(expected)) assert.equal(hash(await readFile(new URL('../' + path, import.meta.url))), expectedSha, path); }); // 基礎byte不符不能用通過的mock掩蓋安全面改動。
