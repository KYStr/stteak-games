              return { calls, adapter, now: () => clock }; // 暴露合成時鐘供截止反例。
            } // 不修改正式時間限制。
            test("成功只宣告診斷收集且沒有遊戲測試", async () => { const mock = fixture(); const report = await executeDiagnosis(mock.adapter, mock.now); assert.equal(report.outcome, "diagnostic-collected"); assert.deepEqual(mock.calls, ["kernel", "executable", "version", "launch", "close"]); for (const key of ["capability", "boot", "operation", "stability"]) assert.equal(report[key].status, "not-run"); assert.equal(report.screenshots.length, 0); }); // 一次launch完成就close，不接回原probe。
            for (const stage of ["kernel", "executable", "version", "launch"]) test(`${stage}失敗立即停止只清理`, async () => { const mock = fixture({ failure: stage }); const report = await executeDiagnosis(mock.adapter, mock.now); assert.equal(report.outcome, "blocked"); assert.equal(mock.calls.at(-1), "close"); assert.equal(mock.calls.indexOf(stage), mock.calls.length - 2); assert.ok(!JSON.stringify(report).includes("secret")); }); // 不重試、不改flag，也不把錯誤原文帶進報告。
            test("不存在執行檔不做version或launch", async () => { const mock = fixture({ executable: "missing" }); const report = await executeDiagnosis(mock.adapter, mock.now); assert.deepEqual(mock.calls, ["kernel", "executable", "close"]); assert.equal(report.launch.status, "not-run"); }); // 預先否證能省掉無意義launch。
            test("版本未核不launch", async () => { const mock = fixture({ version: "unrecognized-or-mismatch" }); await executeDiagnosis(mock.adapter, mock.now); assert.deepEqual(mock.calls, ["kernel", "executable", "version", "close"]); }); // 不換binary或補下載。
            test("launch拒絕保留未知程序建立與清理", async () => { const mock = fixture({ failure: "launch", error: new Error("No usable sandbox!") }); const report = await executeDiagnosis(mock.adapter, mock.now); assert.equal(report.launch.status, "rejected-or-unconfirmed"); assert.equal(report.launch.processCreation, "unknown"); assert.equal(report.cleanup.underlyingProcessCleanup, "not-observed"); assert.equal(report.faults[0].stage, "launch"); assert.equal(report.faults[0].code, "sandbox-failure-reported"); }); // 不能把無handle當從未建子程序或已全面清理。
            test("cleanup失敗不能診斷綠燈", async () => { const mock = fixture({ failure: "close" }); const report = await executeDiagnosis(mock.adapter, mock.now); assert.equal(report.outcome, "blocked"); assert.equal(report.cleanup.status, "incomplete"); }); // 關閉承諾失敗不得假報成功。
            test("總截止後不啟新動作", async () => { const mock = fixture({ elapsed: { kernel: LIMITS.totalMs } }); const report = await executeDiagnosis(mock.adapter, mock.now); assert.deepEqual(mock.calls, ["kernel", "close"]); assert.equal(report.faults[0].code, "diagnostic-deadline"); }); // 不能為診斷追加等待或新round。
            test("診斷無PNG報告可從有序log回收", async () => { const mock = fixture(); const report = await executeDiagnosis(mock.adapter, mock.now); const id = { repository: "KYStr/stteak-games", runId: "12345", commit: "a".repeat(40), attempt: "1" }; const bytes = Buffer.from(JSON.stringify(report)); const result = decodeTransfers(encodeTransfer("report", bytes, id).join("\n"), id); assert.deepEqual(result.outputs.report.bytes, bytes); assert.equal(result.outputs.png, undefined); }); // 此版傳輸只增加diagnostic-collected合法值，不需要圖。
          QA_FILE_INDEX: | # JSON逐欄：path相對檔名、env來源變數、bytes位元組長度、sha256內容校驗；不是執行指令。
            [{"path":"package.json","env":"QA_SOURCE_0","bytes":396,"sha256":"e2b2790d9e484f21534a2d333e2dac4a5a326165d3f88cc96fdb7fce234a0602"},{"path":"package-lock.json","env":"QA_SOURCE_1","bytes":1306,"sha256":"c31662c3b1473ddd719b05f795a2c17a1b2914df439eae58ce17b27665167164"},{"path":"LICENSE","env":"QA_SOURCE_2","bytes":1063,"sha256":"4bfd79f924dfe8db584210eaf1adff63fb41d4e3c02fceb12216118f731f86a3"},{"path":"scripts/gate.mjs","env":"QA_SOURCE_3","bytes":2736,"sha256":"e6e0fca0023e3e885d235fc935c3ede84186450065ee63de139f9e021c850119"},{"path":"scripts/diagnostic-core.mjs","env":"QA_SOURCE_4","bytes":8891,"sha256":"e74d741e98519a423d1ac4f785cec623fcaf850d2791d907d9a9c2635ed3b71f"},{"path":"scripts/diagnose.mjs","env":"QA_SOURCE_5","bytes":7231,"sha256":"2a6dec80916b6b61adf0d5ac1a16ad7a9572f6c828e5359ffc0a03784457b285"},{"path":"scripts/log-transfer.mjs","env":"QA_SOURCE_6","bytes":7639,"sha256":"1b6573462ae468818d6230f9a0555ffa69e7dea6ce2cee4d3cdf5c85ae3cf2d6"},{"path":"scripts/emit-evidence.mjs","env":"QA_SOURCE_7","bytes":1365,"sha256":"00ef7166788858a812432d651921b3bac72ea32ff50ec77f317c71fb441a2db4"},{"path":"scripts/check.mjs","env":"QA_SOURCE_8","bytes":2195,"sha256":"8392120e9b6851e0b7c8f29be01ae3be01a0ea5c9e1c9eb10b156b7d08f7521a"},{"path":"tests/diagnostic.test.mjs","env":"QA_SOURCE_9","bytes":9802,"sha256":"80dc4aedfaf1777c8cdeb288359f1bdaf9679870216cf8e5c45ac3273ed01f4d"}]
        run: | # 下列shell與JavaScript每行均有中文解釋；只做逐byte校驗及臨時檔生成。
          node --input-type=module -e ' // 使用固定Node與標準模組，不執行外部下載程式。
          import { mkdir, writeFile, readFile } from "node:fs/promises"; // 檔案只寫本工作目錄。
          import { createHash } from "node:crypto"; // 每個原文字節都核SHA256。
          import { dirname } from "node:path"; // 僅為固定相對檔名建立目錄。
          const entries = JSON.parse(process.env.QA_FILE_INDEX); // JSON欄位path/env/bytes/sha256分別是檔名、來源變數、長度與校驗值。
          for (const entry of entries) { // 僅走內嵌固定清單，不讀repo或其他檔案。
            if (!/^(?:scripts|tests)\/[a-z.-]+\.mjs$|^package(?:-lock)?\.json$|^LICENSE$/.test(entry.path)) throw new Error("invalid-payload-path"); // 不接受絕對路徑或路徑穿越。
            const bytes = Buffer.from(process.env[entry.env], "utf8"); // 保留YAML literal的原始文字與最後換行，不trim、不重排JSON。
            if (bytes.length !== entry.bytes || createHash("sha256").update(bytes).digest("hex") !== entry.sha256) throw new Error("payload-integrity"); // 貼上、編碼或換行錯誤立即阻擋，不能下載救援副本。
            await mkdir(dirname(entry.path), { recursive: true }); await writeFile(entry.path, bytes, { flag: "wx" }); // 工作區應為乾淨新runner，拒絕覆蓋未知檔。
            if (!(await readFile(entry.path)).equals(bytes)) throw new Error("payload-readback"); // 再從實際檔案逐byte讀回，才允許後續測試。
            console.log(JSON.stringify({ payloadFile: entry.path, bytes: entry.bytes, sha256: entry.sha256 })); // 僅輸出公開測試碼身份，不輸出秘密。
          } // 全部固定payload已核對。
          ' # 結束單引號shell參數，沒有here-doc未註解分隔行。
      - name: Cheap gates and pure mocks first # 先便宜否證，不通過就不下載套件或browser。
        run: node scripts/gate.mjs && npm run check && npm test # 全部語法／mock只用記憶體，不連網或建立真PNG。
      - name: Install exact official test dependency # 僅公開npmregistry的兩個鎖版套件。
        run: npm ci --ignore-scripts --no-audit --no-fund # 不執行依賴安裝script，不配置登入token。
      - name: Install only official Chromium headless shell # 只有root核准派發後runner才可執行；本地準備不執行。
        run: node node_modules/playwright/cli.js install --with-deps --only-shell chromium # 不裝Firefox/WebKit，不改sandbox或OS安全設定。
      - name: One bounded sandbox launch diagnosis # 只收白名單原因與只讀前提，不建立context/page或開遊戲。
        id: diagnosis # 只識別本次啟動診斷，不觸發遊戲或長測。
        run: timeout --signal=TERM --kill-after=5s 30s node scripts/diagnose.mjs # 同一程序群組三十秒TERM、再五秒KILL，上界三十五秒。
      - name: Emit only bounded diagnostic report to raw log # 沒有任何PNG、artifact或cache，只有固定欄位短JSON。
        if: ${{ !cancelled() && steps.diagnosis.outcome != 'skipped' && steps.diagnosis.outcome != '' }} # 只有診斷真的開始才輸出；前置安裝失敗不補造結果。
        run: node scripts/emit-evidence.mjs # 逐塊等待stdout寫完；缺報告或SHA不符即失敗，不再開browser。
