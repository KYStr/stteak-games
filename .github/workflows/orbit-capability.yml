            const allowed = { GITHUB_ACTIONS: "true", RUNNER_ENVIRONMENT: "github-hosted", RUNNER_OS: "Linux", GITHUB_REPOSITORY: "KYStr/stteak-games", GITHUB_REPOSITORY_OWNER: "KYStr", GITHUB_ACTOR: "KYStr", QA_REPOSITORY_PRIVATE: "false", GITHUB_REF: "refs/heads/main", GITHUB_WORKFLOW_REF: "KYStr/stteak-games/.github/workflows/orbit-capability.yml@refs/heads/main", GITHUB_EVENT_NAME: "workflow_dispatch", GITHUB_RUN_ATTEMPT: "1", QA_CONFIRM_NATIVE_CHROME: "true", GITHUB_SHA: "a".repeat(40), GITHUB_WORKFLOW_SHA: "a".repeat(40), GITHUB_RUN_ID: "12345", QA_MODE: "native-chrome" }; // 合成身份不代表真實run。
