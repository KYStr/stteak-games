      - name: Fixed official Node without credentials # 不需要repo讀權或PAT，只讀公開發行資產／runner toolcache。
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 官方v7.1.0完整commit鎖定。
        with: # 不把預設github.token傳給action。
