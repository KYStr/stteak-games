name: One reviewed public game scenario # 單一已審正常操作，不宣稱遊戲完整驗收。
run-name: One ${{ inputs.scenario }} scenario by ${{ github.actor }} # 僅固定白名單選項，不接受任意程式或URL。
on: # 沒有push、PR、schedule或其他自動觸發。
  workflow_dispatch: # 只有owner手動派發一次。
    inputs: # 不接受自選URL、指令或瀏覽器旗標。
      confirm_native_chrome: # 明示確認公開最小probe，不是持續付費或長測授權。
        description: '原生Chrome沙箱＋官方CJK字型＋單一已審正常操作；無長測或自動重試' # 完成就停，不為超過120秒而idle。
        type: boolean # 用明確布林選項，避免字串歧義。
        default: false # 預設不執行。
        required: true # 必須由owner明確確認。
      scenario: # 每輪只能選一個已審遊戲情境，沒有矩陣或連續跑四款。
        description: '唯一正常UI情境；完成即停' # 選項不接受自訂URL或腳本。
        type: choice # GitHub固定選單，runtime仍核白名單。
        required: true # 不依預設推測使用者要測哪款。
        default: neon0014-native1600-assets2 # 本包僅Neon0014原生1600首屏零輸入與兩交付資源精確身份；HTML只metadata。
        options: # 後續情境只有逐份審過才可加入。
          - neon0014-native1600-assets2 # 正常原生390首屏，無click／keyboard／scroll／resize。
permissions: {} # 不checkout、不讀寫GitHub內容、不給token任何可選scope。
concurrency: # 所有分支共用固定群組，沒有矩陣或分片。
  group: stteak-single-public-capability # 最多一個正在執行的probe。
  cancel-in-progress: false # 新派發不干擾既有證據；不要主動排第二輪。
jobs: # 只有一個標準runner job。
  probe: # 十五分鐘連續遊玩沒有job或隱藏入口。
    if: ${{ github.repository == 'KYStr/stteak-games' && github.repository_owner == 'KYStr' && github.actor == 'KYStr' && !github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.confirm_native_chrome }} # 在開runner前核固定owner、公開repo、main、首次手動與明示確認。
    runs-on: ubuntu-24.04 # 標準公開Linux runner；不用larger或self-hosted。
    timeout-minutes: 5 # 含最多兩分鐘字型步驟與一百十五秒browser，整job五分鐘硬截止。
    env: # 不映射任何secret、token或歷史私人QA資料。
      QA_REPOSITORY_PRIVATE: ${{ github.event.repository.private }} # 從GitHub事件取得真實公開性，不依名字猜測。
      QA_CONFIRM_NATIVE_CHROME: ${{ inputs.confirm_native_chrome }} # 只作布林比對，不放進shell。
      QA_MODE: native-chrome # 保留原生Chrome模式，不存在長測。
      QA_SCENARIO: ${{ inputs.scenario }} # 只用精確白名單模組，不接受路徑或URL。
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # npm依賴安裝不能暗中下載browser。
      npm_config_fetch_retries: '0' # 本包不增加npm重試輪數。
      npm_config_audit: 'false' # 安裝時不送無關審計流量，安全更新另審。
      npm_config_fund: 'false' # 無付款或募資動作。
