            test('metadata三秒四KiB最小環境，其他原命令設定不變', () => { for (const key of ['package', 'binaryOwner']) assert.deepEqual(commandOptions(key), { timeout: 3000, killSignal: 'SIGKILL', maxBuffer: 4096, encoding: 'utf8', env: { PATH: '/usr/bin:/bin', LANG: 'C', LC_ALL: 'C' } }); for (const key of ['profileOwner', 'profileSums', 'version']) assert.deepEqual(commandOptions(key), { timeout: 3000, killSignal: 'SIGKILL', maxBuffer: 262144, encoding: 'utf8' }); }); // 沒有額外二十秒Python診斷或命令重試。
