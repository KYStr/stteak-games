name: Dust D0 fixed title to hub native prefix
'on':
  workflow_dispatch:
    inputs:
      confirm_native_chrome:
        type: boolean
        required: true
        default: false
        description: Dust D0 1 context/nav/click, 12 reads, 6 waits, 2 PNG; 120s owned cap; no retry
      scenario:
        type: choice
        default: dust-d0-title-hub-933840bc
        options:
        - dust-d0-title-hub-933840bc
permissions: {}
concurrency:
  group: stteak-single-public-capability
  cancel-in-progress: false
jobs:
  probe:
    if: ${{ github.repository == 'KYStr/stteak-games' && github.repository_owner == 'KYStr' && github.actor
      == 'KYStr' && !github.event.repository.private && github.ref == 'refs/heads/main' && github.event_name
      == 'workflow_dispatch' && github.run_attempt == 1 && inputs.confirm_native_chrome && inputs.scenario
      == 'dust-d0-title-hub-933840bc' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DUST_SCOPE: ${{ inputs.scenario }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      npm_config_fetch_retries: '0'
      npm_config_audit: 'false'
      npm_config_fund: 'false'
    steps:
    - name: Fixed official Node without credentials
      timeout-minutes: 2
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        token: ''
        package-manager-cache: false
    - name: Materialize hash-pinned Dust wrapper only
      env:
        DUST_PAYLOAD: 
      run: "timeout --signal=TERM --kill-after=1s 10s python3 - <<'PY'\nimport os,base64,zlib,hashlib,json,pathlib\n\
        b=base64.b64decode(os.environ['DUST_PAYLOAD'],validate=True)\nassert len(b)==39980 and hashlib.sha256(b).hexdigest()=='78ebe418cecc8cbe8d2f076d3ac9d90a047f0a544c10d1f9ed8b23c3dbb3632b'\n\
        d=zlib.decompressobj(31);raw=d.decompress(b,97406);assert len(raw)==97405 and d.eof and not d.unused_data\n\
        items=json.loads(raw);assert len(items)==13\nfor name,value in items.items():\n p=pathlib.Path(name);assert\
        \ not p.is_absolute() and '..' not in p.parts and p.parts[0] in ('scripts','package.json','package-lock.json','runtime-manifest.json')\n\
        \ data=base64.b64decode(value,validate=True);assert len(data)<262144\n p.parent.mkdir(parents=True,exist_ok=True)\n\
        \ with p.open('xb') as f:f.write(data)\nPY\n"
    - name: Install exact official test dependency
      run: timeout --signal=TERM --kill-after=3s 117s npm ci --ignore-scripts --no-audit --no-fund
    - name: Install only official Ubuntu CJK font
      timeout-minutes: 2
      run: 'FONT_ROOT="$RUNNER_TEMP/qa-official-font" # 固定本job臨時目錄，不修改/etc/apt來源。

        mkdir -p "$FONT_ROOT/lists/partial" # 僅建立本次Ubuntu套件索引暫存。

        printf ''%s\n'' ''deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu
        noble main'' > "$FONT_ROOT/source.list" # 只信Ubuntu既有archive keyring與官方noble/main，不加入第三方來源。

        APT_SCOPE=(-o "Dir::Etc::sourcelist=$FONT_ROOT/source.list" -o ''Dir::Etc::sourceparts=-'' -o
        "Dir::State::lists=$FONT_ROOT/lists" -o ''Dir::Cache::pkgcache='' -o ''Dir::Cache::srcpkgcache=''
        -o ''Acquire::Retries=0'' -o ''Acquire::http::Timeout=20'' -o ''Acquire::https::Timeout=20'')
        # 命令局部來源與零重試，不削弱套件簽章或TLS。

        timeout --signal=TERM --kill-after=3s 45s sudo apt-get "${APT_SCOPE[@]}" update # 一次官方索引更新，逾時即停，不對所有runner第三方repo更新。

        timeout --signal=TERM --kill-after=3s 60s sudo apt-get "${APT_SCOPE[@]}" install -y --no-install-recommends
        --no-install-suggests --no-upgrade --no-remove ''fonts-noto-cjk=1:20230817+repack1-3'' # 只安裝固定無Depends字型包，不升級既有套件、不裝extra字重。

        test "$(dpkg-query -W -f=''${Version}'' fonts-noto-cjk)" = ''1:20230817+repack1-3'' # 安裝後核實際版本，缺失或不同即停止。

        fc-match -f ''%{family}\n'' '':lang=zh-tw'' # 只印非敏感字族供回查；最終仍須原PNG確認中文不是tofu。

        '
    - name: One owned Dust D0 prefix
      run: timeout --signal=TERM --kill-after=1s 121s python3 scripts/supervisor.py
    - name: Emit bounded fixed evidence
      if: ${{ always() }}
      run: timeout --signal=TERM --kill-after=1s 8s python3 scripts/emit.py
