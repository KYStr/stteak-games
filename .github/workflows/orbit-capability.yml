name: Exact155 or exact156 Moss0020 harvest90 entry AB # 本次另明示兩精確版均限本新入口A/B後27pointer收成；第三版零Chrome，不延續舊cap-only輪。
run-name: Exact155 or exact156 Moss0020 harvest90 entry AB by ${{ github.actor }} # 156獨立新Moss profile，僅本包已審情境，不擴其他遊戲。
on: # 沒有push、PR、schedule或其他自動觸發。
  workflow_dispatch: # 只有owner手動派發一次。
