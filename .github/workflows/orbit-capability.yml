            test("缺一塊拒絕", () => { const data = sample(); const index = data.lines.findIndex(line => line.startsWith("QA_CHUNK_V1 png 2/")); data.lines.splice(index, 1); assert.throws(() => decodeTransfers(data.lines.join("\n"), expected)); }); // 不因首尾存在就接受中間缺圖資料。
            test("重複塊拒絕", () => { const data = sample(); const index = data.lines.findIndex(line => line.startsWith("QA_CHUNK_V1 png 1/")); data.lines.splice(index, 0, data.lines[index]); assert.throws(() => decodeTransfers(data.lines.join("\n"), expected)); }); // 不自動去重掩蓋來源問題。
