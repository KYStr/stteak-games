          import {assessCameraPre} from './pre-admission.mjs'; // 中文：同次pre首拒投影，不改後續stable或能力。
          import {validateImage,TOTAL_IMAGE_BYTES} from '../image-contract.mjs'; // 中文：只增加固定stop-viewport單張證據契約，不讀取像素。
          import {createHash} from 'node:crypto'; // 中文：只摘要原生PNG，不重畫或注入畫面。
          import {readVisibleAether,readStopViewport} from './visible-reader.mjs'; // 中文：只固定可見DOM，正常鍵鼠能力。
          export function createAdapter({page,url,now,workEnd,guard,bounded,sleep,closeGuard,restrict,deadline}){ // 中文：所有截止由host傳入，不自立新總預算。
           const ownedContext=page.context();const images=[],labels=new Set(['entry','arrival','resumed','activated']);const held=new Set();let reads=0,holds=0,clicks=0,revoked=false,leaseFailure=null,releaseFailure=null,cleanupReleaseFailure=null,stopOnly=false,stopUsed=false,stopObservation=null,cameraTrialObservation=null;const keys=new Set(['w','a','s','d','Shift','Space']); // 中文：不提供任意鍵、字串輸入或seed能力。
           const active=()=>{guard();if(revoked||stopOnly||now()>=workEnd)throw Error('adapter-revoked');}; // 中文：close後一般能力永久撤回。
           const failure=(stage,e)=>{let message=null;try{message=e?.message;}catch{}return {stage,code:['operation-deadline','operation-budget','lease-expired','adapter-revoked','host-revoked','cleanup-incomplete'].includes(message)?message:'operation-rejected'};}; // 中文：三診斷共用單讀快照；getter拒絕只轉固定未知，不覆原始失敗，不保存任意原文。
           async function read(action=null,outerEnd=workEnd){active();if(action==='camera'||action==='camera-after'||action==='camera-post')throw Error('reader-action');if(!Number.isFinite(outerEnd)||outerEnd>workEnd||now()>=outerEnd)throw Error('operation-budget');if(++reads>440)throw Error('reader-cap');const s=await bounded(()=>{active();return page.evaluate(readVisibleAether,{url,action});},1500,false,outerEnd);if(!s.locationValid||!s.focused||s.visibility!=='visible'||s.fatal)throw Error('surface-unavailable');return s;} // 中文：一次唯讀evaluate，無隱藏讀寫。
           async function click(action){active();if(++clicks>6)throw Error('click-cap');const s=await read(action);if(!s.target?.usable)throw Error('target-not-visible');await bounded(()=>{active();return page.mouse.click(s.target.x,s.target.y);},800);} // 中文：原生滑鼠，不synthetic click、不修改焦點state。
           async function release(end,cleanup=false){for(const key of [...held]){await bounded(()=>{if(cleanup)closeGuard(end);else active();return page.keyboard.up(key);},Math.min(800,end-now()),cleanup,end);held.delete(key);}} // 中文：只釋已持有租約，不新增down；真正invoke前仍核同截止。
           async function hold(requested,ms,outerEnd=workEnd){active();if(!Number.isFinite(outerEnd)||outerEnd>workEnd||now()>=outerEnd)throw Error('lease-admission');if(++holds>360||!Array.isArray(requested)||requested.length>3||new Set(requested).size!==requested.length||requested.some(k=>!keys.has(k))||!Number.isInteger(ms)||ms<1||ms>600||held.size)throw Error('lease-input');const start=now(),budget=2*requested.length*800+ms+200,parentEnd=Math.min(deadline(),outerEnd);if(!Number.isFinite(parentEnd)||parentEnd>workEnd||parentEnd-start<=budget)throw Error('lease-admission');const end=start+budget,pressEnd=end-(requested.length*800+100); // 中文：一次足額準入及固定租約界；保留正常up窗口，不延長原phase/work父界。
            let primary=null,secondary=null,stage='key-down';try{for(const key of requested){if(now()>=pressEnd)throw Error('lease-expired');held.add(key);await bounded(()=>{active();if(now()>=pressEnd)throw Error('lease-expired');return page.keyboard.down(key);},Math.min(800,pressEnd-now()),false,pressEnd);if(now()>=pressEnd)throw Error('lease-expired');}stage='hold-sleep';await bounded(()=>{active();if(now()>=pressEnd)throw Error('lease-expired');return sleep(ms);},Math.min(ms+100,pressEnd-now()),false,pressEnd);if(now()>=pressEnd)throw Error('lease-expired');}catch(e){primary=e;leaseFailure??=failure(stage,e);}finally{try{await release(end);}catch(e){secondary=e;releaseFailure??=failure('key-up',e);}}if(primary)throw primary;if(secondary)throw secondary; // 中文：先前失敗不得被finally釋鍵覆蓋；仍只同一租約原界釋鍵，兩項分列。
           } // 中文：僅短有界正常持鍵。
           async function capture(label){active();if(!labels.delete(label)||images.length>=4)throw Error('image-cap');const b=await bounded(()=>page.screenshot({type:'png',timeout:Math.min(2000,workEnd-now())}),2000);if(!Buffer.isBuffer(b)||b.length>2097152)throw Error('image-bytes');images.push({label,bytes:b.length,sha256:createHash('sha256').update(b).digest('hex'),buffer:b});} // 中文：固定四名單張2MiB，不補截圖重試。
           async function observeStopViewport(parentEnd,expected){ // 中文：原拒絕前唯一view-only分支，不從永久停止狀態恢復一般能力。
            active();if(stopUsed)throw Error('stop-observation-used');stopUsed=true;stopOnly=true;const start=now(),parent=Math.min(workEnd,deadline(),parentEnd),end=Math.min(parent,start+9000);let prior=start; // 中文：唯一九秒共界；一般輸入立即永久停，僅此函式可點一次相機。
            const timeCheck=(limit=end)=>{guard();const t=now();if(revoked||!Number.isFinite(t)||!Number.isFinite(limit)||!Number.isFinite(end)||t<prior||t>=Math.min(end,limit))throw Error('stop-observation-unsafe');prior=t;}; // 中文：有限單調時計及原撤權在每次身份前後都核。
            const check=(limit=end)=>{timeCheck(limit);const pages=ownedContext.pages();if(page.context()!==ownedContext||pages.length!==1||pages[0]!==page||page.url()!==url)throw Error('stop-observation-unsafe');timeCheck(limit);}; // 中文：getter耗時或同步撤權不能越過最後採入/呼叫門。
            const stable=s=>{const l=s?.labels,e=/^(\d{1,3})%$/.exec(l?.['energy-value']??'');return s?.locationValid===true&&s.focused===true&&s.visibility==='visible'&&!s.modal&&!s.fatal&&!s.landing&&s.hud===true&&s.viewport?.width===1600&&s.viewport?.height===900&&s.dpr===1&&l?.['flight-mode']==='乘風滑翔'&&e&&Number(e[1])>=25&&Number(e[1])<=100&&['route-label','course-title','region','station-count'].every(k=>typeof expected?.[k]==='string'&&l[k]===expected[k]);}; // 中文：只比較原同次公開路線/航段與正常滑翔，無private/settings讀取。
            const operation=async(cap,fn)=>{const limit=Math.min(end,now()+cap);check(limit);const v=await bounded(()=>fn(()=>check(limit),limit),cap,false,limit);check(limit);return v;}; // 中文：各操作截止只建一次，getter/排隊/invoke/ACK不得越1500/800/4500較早界。
            const viewRead=async action=>{reads++;return operation(1500,permit=>{const evaluate=page.evaluate,args={url,action};permit();return Reflect.apply(evaluate,page,[readVisibleAether,args]);});}; // 中文：兩次各1500ms固定讀取，沒有普通click暗加第三次read。
            stopObservation={status:'unconfirmed',camera:'not-attempted'};try{ // 中文：只固定枚舉，不保存toast原文或私態。
             check();if(!Number.isFinite(start)||parent-start<=9000||held.size||reads>438||clicks>=6){stopObservation={status:'not-attempted',camera:'not-attempted'};return;} // 中文：餘額等界與原cap不足零read/click/shot，兩讀與一click預留原總額。
             const before=await viewRead('camera');if(!stable(before)||before.target?.usable!==true){stopObservation={status:'unsafe-surface',camera:'not-attempted'};return;} // 中文：唯一可見button正常hit/動畫/disabled predicate不通過就停止。
             const x=before.target.x,y=before.target.y;if(!Number.isFinite(x)||!Number.isFinite(y)||x<0||y<0||x>=1600||y>=900)throw Error('stop-observation-unsafe');check();clicks++;stopObservation={status:'unconfirmed',camera:'attempted'}; // 中文：只固定中心點，不接受任意坐標；計入原六次click。
