            test('截圖前錯址不呼叫API且回root仍保持fatal', async () => { const mock = fixture(); mock.redirect(); await assert.rejects(mock.lease.capture(), /unexpected-navigation/); mock.restore(); await assert.rejects(mock.lease.capture(), /unexpected-navigation/); assert.equal(mock.calls.length, 0); }); // 不為了diagnostic讀登入頁。
