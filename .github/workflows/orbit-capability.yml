            test('唯一scenario／精確source身份／零輸入adapter接線', async () => { assert.equal(selectedScenario('moss-cold-entry-diagnostic').TARGET, TARGET); for (const old of ['moss-harvest60-1600-pointer', 'moss-harvest60-pointer', 'moss-sleep60-pointer']) assert.throws(() => selectedScenario(old)); const adapter = await readFile('scripts/moss/playwright-adapter.mjs', 'utf8'), scene = await readFile('scripts/moss/scenario.mjs', 'utf8'); assert.doesNotMatch(adapter, /page\.(?:mouse|keyboard)|\.click\(|\.press\(|\.dispatchEvent\(|\.setInputFiles\(/); assert.match(scene, /totalMs: 20000, requiredMs: 60000, readyMs: 5000, readMs: 8000, pngMs: 5000/); assert.match(adapter, /phase: 'entry', cellNumber: null, includeTarget: true, selectors: \{ entry: '#start' \}/); assert.equal((adapter.match(/page\.evaluate\(/g) || []).length, 1); }); // 無第二次evaluate暖機、無harvest能力。
          QA_FILE_INDEX: | # JSON逐欄：path相對檔名、env來源變數、bytes位元組長度、sha256內容校驗；不是執行指令。
            [{"path":"package.json","env":"QA_SOURCE_0","bytes":392,"sha256":"f0ac519f2f9ff827e77abea1847960536d335a632ff0d622d9ec730e8c704331"},{"path":"package-lock.json","env":"QA_SOURCE_1","bytes":1304,"sha256":"ad9529218d95135e68e6fee10d2da9d46be786aee53af5e59eb9d2db97b15849"},{"path":"LICENSE","env":"QA_SOURCE_2","bytes":1063,"sha256":"4bfd79f924dfe8db584210eaf1adff63fb41d4e3c02fceb12216118f731f86a3"},{"path":"scripts/core.mjs","env":"QA_SOURCE_3","bytes":9855,"sha256":"7631a303b9b2be0ac4bf2461deb573cc625407608508f48fb801fffab0c18b8a"},{"path":"scripts/select-scenario.mjs","env":"QA_SOURCE_4","bytes":829,"sha256":"19ad73052e0c8e42fcb5490a1ad9f4a287bbc6586eb1c59bebbbe8766298c5c6"},{"path":"scripts/scenario-health.mjs","env":"QA_SOURCE_5","bytes":1400,"sha256":"1f052168e806d84fdb0a178f089c82844e69fb5f2828adb61d9e69c167791c0c"},{"path":"scripts/snapshot-lease.mjs","env":"QA_SOURCE_6","bytes":4185,"sha256":"822bdd3e15b3329439ebbd48ae47c50f23afd9a5764f85af379d2ccd0e222ade"},{"path":"scripts/moss/contract.mjs","env":"QA_SOURCE_7","bytes":6602,"sha256":"00870052832d3ce9a8879e07bf1a6194ec13b4b508d372830413ebd7d0a1f6ae"},{"path":"scripts/moss/entry-reader.mjs","env":"QA_SOURCE_8","bytes":10090,"sha256":"f0283dbbd337d016cc313c457091013f621830e519e30a9f56f45b68e55c72f4"},{"path":"scripts/moss/playwright-adapter.mjs","env":"QA_SOURCE_9","bytes":1534,"sha256":"bcd78d85012d95a7d402ce01d686928774db8bfa0860c8f6ffe6ae546ccfcd94"},{"path":"scripts/moss/scenario.mjs","env":"QA_SOURCE_10","bytes":5318,"sha256":"4bf9505188c992e4652033c074596127f7522e69671a9c1433603f75226936f3"},{"path":"scripts/moss/tests/dom-fixture.mjs","env":"QA_SOURCE_11","bytes":5190,"sha256":"f463f68de67d58fd1beadf66e49679bfc8004f36f7b16f183651adf9d91ca6ea"},{"path":"scripts/moss/tests/native-envelope.fixture.json","env":"QA_SOURCE_12","bytes":12989,"sha256":"63839f75f22dd6255c9933233a702c29cc16148d75f66c6de918c9cc3837f7a2"},{"path":"scripts/moss/tests/reader-reference.mjs","env":"QA_SOURCE_13","bytes":9284,"sha256":"bdb08ff6b4d60253cf510e291249ea97917e3764cd84ce5289669a6a0465abb2"},{"path":"scripts/moss/tests/reader.test.mjs","env":"QA_SOURCE_14","bytes":5848,"sha256":"5e1a67234a50f3d328f4d8f19d8f32eff9c208b2726c98fc19c7fef8d67fe861"},{"path":"scripts/moss/tests/scenario.test.mjs","env":"QA_SOURCE_15","bytes":10580,"sha256":"87f79f28a0d4d4eccdddfceda404465f65d9e03bccba7c18712b8ec71519da33"},{"path":"scripts/diagnostics.mjs","env":"QA_SOURCE_16","bytes":4635,"sha256":"0d1f2988ccca9523488d0a8f12ac929071c61f6ba3b218db92eb66b0d5c8f763"},{"path":"scripts/native.mjs","env":"QA_SOURCE_17","bytes":22520,"sha256":"10dcf013541d7f7e8a2c1338a2f8f41e0ef581dfd1f2e931b28ff925b67ee080"},{"path":"scripts/gate.mjs","env":"QA_SOURCE_18","bytes":2934,"sha256":"4665e5f2a404ea8bd90ee52df6979e9129523c7eae89d4ba2b0b0f104251cbaa"},{"path":"scripts/probe.mjs","env":"QA_SOURCE_19","bytes":15059,"sha256":"ad8269ed0baff002257f1b93262e1f5c87ba8deb5e738f6990ff8f21cd13b850"},{"path":"scripts/log-transfer.mjs","env":"QA_SOURCE_20","bytes":9342,"sha256":"6a1e420744baf17d7d9100b18ce0482b21af0c652667a21bf4ccf90236d357b2"},{"path":"scripts/emit-evidence.mjs","env":"QA_SOURCE_21","bytes":1987,"sha256":"a865fda7646a03b4c6258cea7efdabb54bbcb197e66cb2ed5200c7038b389b20"},{"path":"scripts/check.mjs","env":"QA_SOURCE_22","bytes":2791,"sha256":"a351f3e59b4ac1b17bafa28ed8494c36286f94f6b7ce9fd5f3d4876abd6739c0"},{"path":"tests/core.test.mjs","env":"QA_SOURCE_23","bytes":12054,"sha256":"6e8a5c5b3f50400ec90a28cc4920fcfc40991daed15486bf68787e562c78d8da"},{"path":"tests/moss.test.mjs","env":"QA_SOURCE_24","bytes":195,"sha256":"0c47ed5d7eb6951e86ce6de71cebfd9c079ce272d69e3d8397a77d37a8e1b22d"},{"path":"tests/moss-integration.test.mjs","env":"QA_SOURCE_25","bytes":14144,"sha256":"9c46f6680407bd8915b6b865b651af0923d5148be119a389ccef91039d683613"},{"path":"tests/snapshot-lease.test.mjs","env":"QA_SOURCE_26","bytes":11396,"sha256":"93fd38668c2e836c931c6292a1bad63dbe1edd00a3acdb5c8d6d8d574dacab1c"},{"path":"tests/native.test.mjs","env":"QA_SOURCE_27","bytes":23738,"sha256":"b95030ec7e1044f51034840789834bf72cbfc8ac92c0e6244f3c1f027c4f6ba4"},{"path":"tests/public.test.mjs","env":"QA_SOURCE_28","bytes":8123,"sha256":"ca01a8f31baec18f6490b352fff28f50dadf72f1017862b776424ac5f843f595"},{"path":"tests/dual-profile.test.mjs","env":"QA_SOURCE_29","bytes":15649,"sha256":"ff8126c574af4695ea05672e9a3e1ae54474a0ba0b730730f765875cbcfd145c"},{"path":"tests/cold-package.test.mjs","env":"QA_SOURCE_30","bytes":6504,"sha256":"c1ecbfca2cfe51d6b31ac2047e13bc9d73e961ef5b02c6712011f771830bb4c4"}]
        run: | # 下列shell與JavaScript每行均有中文解釋；只做逐byte校驗及臨時檔生成。
          node --input-type=module -e ' // 使用固定Node與標準模組，不執行外部下載程式。
          import { mkdir, writeFile, readFile } from "node:fs/promises"; // 檔案只寫本工作目錄。
          import { createHash } from "node:crypto"; // 每個原文字節都核SHA256。
          import { dirname } from "node:path"; // 僅為固定相對檔名建立目錄。
          const entries = JSON.parse(process.env.QA_FILE_INDEX); // JSON欄位path/env/bytes/sha256分別是檔名、來源變數、長度與校驗值。
          for (const entry of entries) { // 僅走內嵌固定清單，不讀repo或其他檔案。
            const mossPaths = ["scripts/moss/contract.mjs", "scripts/moss/entry-reader.mjs", "scripts/moss/playwright-adapter.mjs", "scripts/moss/scenario.mjs", "scripts/moss/tests/dom-fixture.mjs", "scripts/moss/tests/native-envelope.fixture.json", "scripts/moss/tests/reader-reference.mjs", "scripts/moss/tests/reader.test.mjs", "scripts/moss/tests/scenario.test.mjs"]; // 僅已列零輸入診斷模組／原reader對照與純fixture，不開任意子路徑。
            if (!/^(?:scripts|tests)\/[a-z.-]+\.mjs$|^package(?:-lock)?\.json$|^LICENSE$/.test(entry.path) && !mossPaths.includes(entry.path)) throw new Error("invalid-payload-path"); // 不接受絕對路徑、未知子目錄或路徑穿越。
            const bytes = Buffer.from(process.env[entry.env], "utf8"); // 保留YAML literal的原始文字與最後換行，不trim、不重排JSON。
            if (bytes.length !== entry.bytes || createHash("sha256").update(bytes).digest("hex") !== entry.sha256) throw new Error("payload-integrity"); // 貼上、編碼或換行錯誤立即阻擋，不能下載救援副本。
            await mkdir(dirname(entry.path), { recursive: true }); await writeFile(entry.path, bytes, { flag: "wx" }); // 工作區應為乾淨新runner，拒絕覆蓋未知檔。
            if (!(await readFile(entry.path)).equals(bytes)) throw new Error("payload-readback"); // 再從實際檔案逐byte讀回，才允許後續測試。
            console.log(JSON.stringify({ payloadFile: entry.path, bytes: entry.bytes, sha256: entry.sha256 })); // 僅輸出公開測試碼身份，不輸出秘密。
          } // 全部固定payload已核對。
          ' # 結束單引號shell參數，沒有here-doc未註解分隔行。
      - name: Cheap gates and pure mocks first # 先便宜否證，不通過就不下載套件或browser。
        run: node scripts/gate.mjs && node scripts/select-scenario.mjs && npm run check && npm test # 全部語法／mock只用記憶體，不連網或建立真PNG。
      - name: Install exact official test dependency # 僅公開npmregistry的兩個鎖版套件。
        run: npm ci --ignore-scripts --no-audit --no-fund # 不執行依賴安裝script，不配置登入token。
      - name: Install only official Ubuntu CJK font # 僅字型與fontconfig既有快取觸發，不裝browser或改任何安全設定。
        timeout-minutes: 2 # 此步驟最多兩分鐘；失敗不進browser。
        run: | # 所有來源只在本job臨時清單，保持原生系統apt安全驗證。
          FONT_ROOT="$RUNNER_TEMP/qa-official-font" # 固定本job臨時目錄，不修改/etc/apt來源。
          mkdir -p "$FONT_ROOT/lists/partial" # 僅建立本次Ubuntu套件索引暫存。
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main' > "$FONT_ROOT/source.list" # 只信Ubuntu既有archive keyring與官方noble/main，不加入第三方來源。
          APT_SCOPE=(-o "Dir::Etc::sourcelist=$FONT_ROOT/source.list" -o 'Dir::Etc::sourceparts=-' -o "Dir::State::lists=$FONT_ROOT/lists" -o 'Dir::Cache::pkgcache=' -o 'Dir::Cache::srcpkgcache=' -o 'Acquire::Retries=0' -o 'Acquire::http::Timeout=20' -o 'Acquire::https::Timeout=20') # 命令局部來源與零重試，不削弱套件簽章或TLS。
          timeout --signal=TERM --kill-after=3s 45s sudo apt-get "${APT_SCOPE[@]}" update # 一次官方索引更新，逾時即停，不對所有runner第三方repo更新。
          timeout --signal=TERM --kill-after=3s 60s sudo apt-get "${APT_SCOPE[@]}" install -y --no-install-recommends --no-install-suggests --no-upgrade --no-remove 'fonts-noto-cjk=1:20230817+repack1-3' # 只安裝固定無Depends字型包，不升級既有套件、不裝extra字重。
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3' # 安裝後核實際版本，缺失或不同即停止。
          fc-match -f '%{family}\n' ':lang=zh-tw' # 只印非敏感字族供回查；最終仍須原PNG確認中文不是tofu。
      - name: One sandbox session for exact selected profile # 155或156同等gate後僅原Moss收成；能力不足即blocked、不重開。
        id: capability # 供結果回讀識別，不觸發下游長測。
        run: timeout --signal=TERM --kill-after=5s 85s node scripts/probe.mjs # 同一程序群組八十五秒TERM、再五秒KILL，上界九十秒。
      - name: Emit only bounded public evidence to raw log # 不使用upload-artifact、不使用cache，日誌只含本輪公開圖及短報告。
        if: ${{ !cancelled() && steps.capability.outcome != 'skipped' && steps.capability.outcome != '' }} # 只有probe真的開始才輸出；前置安裝失敗不補造結果。
        run: node scripts/emit-evidence.mjs # 逐塊等待stdout寫完；缺圖／缺報告／SHA不符即失敗，不再開browser。
