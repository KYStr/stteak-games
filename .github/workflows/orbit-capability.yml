          FONT_ROOT="$RUNNER_TEMP/qa-official-font" # 固定本job臨時目錄，不修改/etc/apt來源。
          mkdir -p "$FONT_ROOT/lists/partial" # 僅建立本次Ubuntu套件索引暫存。
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main' > "$FONT_ROOT/source.list" # 只信Ubuntu既有archive keyring與官方noble/main，不加入第三方來源。
          APT_SCOPE=(-o "Dir::Etc::sourcelist=$FONT_ROOT/source.list" -o 'Dir::Etc::sourceparts=-' -o "Dir::State::lists=$FONT_ROOT/lists" -o 'Dir::Cache::pkgcache=' -o 'Dir::Cache::srcpkgcache=' -o 'Acquire::Retries=0' -o 'Acquire::http::Timeout=20' -o 'Acquire::https::Timeout=20') # 命令局部來源與零重試，不削弱套件簽章或TLS。
          timeout --signal=TERM --kill-after=3s 45s sudo apt-get "${APT_SCOPE[@]}" update # 一次官方索引更新，逾時即停，不對所有runner第三方repo更新。
          timeout --signal=TERM --kill-after=3s 60s sudo apt-get "${APT_SCOPE[@]}" install -y --no-install-recommends --no-install-suggests --no-upgrade --no-remove 'fonts-noto-cjk=1:20230817+repack1-3' # 只安裝固定無Depends字型包，不升級既有套件、不裝extra字重。
          test "$(dpkg-query -W -f='${Version}' fonts-noto-cjk)" = '1:20230817+repack1-3' # 安裝後核實際版本，缺失或不同即停止。
          fc-match -f '%{family}\n' ':lang=zh-tw' # 只印非敏感字族供回查；最終仍須原PNG確認中文不是tofu。
      - name: One sandbox WebGL2 and reviewed scenario # 能力不足即blocked，不使用危險旗標或重開browser。
        id: capability # 供結果回讀識別，不觸發下游長測。
        run: timeout --signal=TERM --kill-after=5s 85s node scripts/probe.mjs # 同一程序群組八十五秒TERM、再五秒KILL，上界九十秒。
      - name: Emit only bounded public evidence to raw log # 不使用upload-artifact、不使用cache，日誌只含本輪公開圖及短報告。
        if: ${{ !cancelled() && steps.capability.outcome != 'skipped' && steps.capability.outcome != '' }} # 只有probe真的開始才輸出；前置安裝失敗不補造結果。
        run: node scripts/emit-evidence.mjs # 逐塊等待stdout寫完；缺圖／缺報告／SHA不符即失敗，不再開browser。
