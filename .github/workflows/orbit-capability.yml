            test('正常close後report精確列圖才host保存原Buffer', async () => { const mock = fixture(); const metadata = await mock.lease.capture(); mock.close(); await mock.lease.persistForReport(reportWith(metadata), mock.writeFile); assert.equal(mock.writes.length, 1); assert.equal(mock.writes[0].file, 'artifacts/boot.png'); assert.equal(mock.writes[0].value, mock.bytes); assert.equal(mock.calls.length, 1); }); // host保存不再healthy或browserAPI，不被closed誤擋。
