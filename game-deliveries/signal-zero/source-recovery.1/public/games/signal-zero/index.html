<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>零號訊號 · Signal Zero</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%225%22%20fill%3D%22%23061019%22%2F%3E%3Cpath%20d%3D%22M8%209h16L8%2023h16%22%20fill%3D%22none%22%20stroke%3D%22%2381f7ce%22%20stroke-width%3D%223%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/utils/BufferGeometryUtils.js":"./vendor/BufferGeometryUtils.js"}}</script></head>
<body><main id="game"><canvas id="world" aria-label="零號訊號三維潛行場景"></canvas><div class="vignette"></div>
<header id="masthead"><span class="wordmark">S/Z<span> 零號訊號</span></span><span class="build">SIGNAL ZERO · <b id="build-label">1.0</b></span><button id="pause" aria-label="暫停遊戲">Ⅱ</button></header>
<section id="hud" hidden><div class="mission"><small id="region"></small><h2 id="mission-title"></h2><p id="objectives"></p></div><div class="telemetry"><span id="time">00:00</span><strong id="alert">○ 隱匿</strong><progress id="suspicion" max="1" value="0" aria-label="察覺程度"></progress></div><div id="route"><span id="route-fill"></span></div><div id="context" aria-live="polite"></div><div id="toast" role="status"></div><div class="equipment" id="equipment"></div><div class="key-hints">A D 移動　W 互動／攀梯　S 蹲　SPACE 跳　Q 換工具　E 使用</div></section>
<nav id="touch" aria-label="觸控遊戲操作" hidden><div class="move-pad"><button data-input="left" aria-label="向左">◀</button><button data-input="right" aria-label="向右">▶</button></div><div class="action-pad"><button data-input="crouch">蹲</button><button data-input="up">互動<br>攀梯</button><button data-input="tool">工具</button><button data-input="jump" class="jump">跳</button></div></nav>
<section id="overlay" class="overlay" aria-label="遊戲選單"></section><div id="storage-warning" role="status" hidden></div><div class="rotate">↻<br>橫向遊玩，路線看得更清楚。<small>請旋轉裝置；遊戲已暫停。</small></div>
</main><script type="module" src="./app.js" onerror="document.getElementById('overlay').innerHTML='<div class=panel><h1>遊戲檔案載入失敗。</h1><p>請確認連線後重新整理；已保存的進度會保留。</p><button onclick=location.reload()>重新載入</button></div>'"></script></body></html>
